<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speakline — get your speaking plan</title>
<meta name="description" content="A 2-minute quiz and a 10-second voice test. Get a personal plan for your next important conversation.">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Web funnel (web2app): quiz → voice test → plan → email → paywall → demo payment → the app opens with the plan already active.
   Same tokens as the app (../index.html), so the hand-off feels like one product. */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --card2:#F2F2F5; --ink:#1D1D1F; --on-ink:#FFFFFF; --muted:#86868B; --soft:#515154;
  --line:#E3E3E8; --line2:#C7C7CC; --a:#0A5BD8; --b:#3D8BFF; --sel:#EDF4FF; --ring:rgba(10,91,216,.35);
  --gold:#C98A0B; --gold-ink:#8A5A00; --gold-tint:#FFF6E2; --good:#1E9E57; --good-tint:#E6F4EC; --bad:#D93025; --bad-tint:#FDECEA;
  --navy:#0B1B33; --navy2:#0E2E63;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(17,24,39,.05);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --on-ink:#000000; --muted:#8E8E93; --soft:#C7C7CC;
    --line:#2C2C2E; --line2:#48484A; --a:#3D86FF; --b:#7FB2FF; --sel:#0E2547; --ring:rgba(61,134,255,.45);
    --gold:#F2B53A; --gold-ink:#FFD27A; --gold-tint:#2A2212; --good:#30D158; --good-tint:#10291A; --bad:#FF6961; --bad-tint:#2E1513;
    --navy2:#123A7A; --shadow:none; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.47 var(--text);letter-spacing:-.016em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:12px}
h1,h2,p{margin:0}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;
  padding:max(14px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.logo{display:flex;gap:8px;align-items:center;font:700 19px/1 var(--display);letter-spacing:-.025em}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--navy2),var(--a));display:grid;place-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.langs{display:flex;gap:4px}
.lang{border:0;border-radius:999px;padding:6px 10px;font-size:13px;background:var(--card2);cursor:pointer}
.lang[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:600}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--a);border-radius:3px;transition:width .35s}
.h1{font:700 32px/1.1 var(--display);letter-spacing:-.035em;text-wrap:balance}
.h1.big{font-size:38px}
.h2{font:700 22px/1.2 var(--display);letter-spacing:-.03em}
.p{color:var(--soft);font-size:16px}
.small{font-size:13px;color:var(--muted)}
.center{text-align:center}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border-radius:22px;padding:18px;display:grid;gap:10px;box-shadow:var(--shadow)}
.btn{min-height:56px;border:0;border-radius:999px;background:var(--a);color:#fff;font:600 17px/1 var(--text);cursor:pointer;padding:0 22px;width:100%;transition:transform .15s,filter .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--card2);color:var(--a)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--a);cursor:pointer;padding:8px;font-size:15px}
.spacer{flex:1}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:62px;padding:12px 16px;border-radius:18px;border:2px solid transparent;background:var(--card);box-shadow:var(--shadow);cursor:pointer}
.opt .em{font-size:24px;width:32px;text-align:center;flex:none}
.opt span{flex:1}
.opt b{display:block;font-weight:600}
.opt small{font-size:13px;color:var(--muted)}
.opt i{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.opt.radio i{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--a);background:var(--sel)}
.opt[aria-pressed="true"] i{border-color:var(--a);background:var(--a)}
.opt[aria-pressed="true"] i::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.opt.radio[aria-pressed="true"] i::after{width:8px;height:8px;border:0;border-radius:50%;background:#fff;transform:none}
.hero{border-radius:26px;padding:22px;background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 62%,#0A4FBF 100%);color:#fff;display:grid;gap:10px}
.hero .p{color:#C3CEDD}
.bubble{background:rgba(255,255,255,.12);border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:15px}
.bubble mark{background:rgba(255,105,97,.3);color:#FFB4AE;border-radius:4px;padding:0 3px}
.fact{display:grid;gap:14px;justify-items:center;text-align:center;padding:10px 0}
.fact .ico{width:84px;height:84px;border-radius:26px;background:var(--sel);display:grid;place-items:center;font-size:40px}
.mic{width:132px;height:132px;border-radius:50%;border:0;background:var(--a);color:#fff;display:grid;place-items:center;cursor:pointer;justify-self:center;position:relative;box-shadow:0 14px 40px rgba(10,91,216,.35)}
.mic.rec{background:var(--bad);box-shadow:0 14px 40px rgba(217,48,37,.35)}
.mic.rec::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--bad);opacity:.5;animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:.6}to{transform:scale(1.25);opacity:0}}
.timer{font:700 44px/1 var(--display);text-align:center;letter-spacing:-.03em}
.live{min-height:52px;text-align:center;color:var(--soft);font-size:15px}
.live mark{background:var(--bad-tint);color:var(--bad);border-radius:4px;padding:0 3px}
.ld{display:grid;justify-items:center;gap:12px;padding-top:6px}
.ld-ring{position:relative;width:148px;height:148px}
.ld-ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 34px/1 var(--display);letter-spacing:-.03em}
.ld-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.ld-chips span{background:var(--sel);color:var(--a);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.gets{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.gets li{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:center;font-size:15px;opacity:.28;transition:opacity .4s}
.gets li.on{opacity:1}
.gets .gi{width:26px;height:26px;border-radius:50%;background:var(--line2);display:grid;place-items:center;transition:background .4s}
.gets li.on .gi{background:var(--good)}
.ana{display:grid;gap:16px}
.ana-row{display:grid;gap:8px}
.ana-row div{display:flex;justify-content:space-between;font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--a);border-radius:4px;transition:width 1.1s ease}
.score{display:flex;align-items:flex-end;gap:16px}
.score .now{font:700 64px/1 var(--display);letter-spacing:-.04em}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--card2);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font:700 20px/1.1 var(--display)}
.stat b.bad{color:var(--bad)}.stat b.good{color:var(--good)}
.chart svg{display:block;width:100%;height:auto}
.input{width:100%;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-size:17px}
.input:focus{border-color:var(--a);outline:0;box-shadow:0 0 0 4px var(--ring)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--soft);cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--a);flex:none}
.check a{color:var(--a)}
.pw-bars{display:flex;gap:14px;align-items:flex-end;height:150px}
.pw-bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.pw-bars i{display:block;width:100%;border-radius:12px 12px 6px 6px;background:var(--line)}
.pw-bars i.t{background:linear-gradient(180deg,var(--b),var(--a))}
.pw-bars span{font:700 18px/1 var(--display)}
.pw-bars small{font-size:12px;color:var(--muted)}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feat li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center}
.feat .fi{width:28px;height:28px;border-radius:50%;background:var(--a);display:grid;place-items:center}
.feat b{display:block;font-size:15px}.feat small{color:var(--muted);font-size:13px}
.plans{display:grid;gap:10px}
.plan{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;min-height:70px;padding:12px 16px;border-radius:18px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.plan[aria-checked="true"]{border-color:var(--a);background:var(--sel)}
.plan b{display:block;font-size:16px}.plan small{color:var(--muted);font-size:13px}
.plan strong{font:700 19px/1 var(--display);white-space:nowrap}
.plan em{position:absolute;top:-10px;right:14px;font-style:normal;font-size:11px;font-weight:700;background:linear-gradient(135deg,#F7CF6E,#D99A1E);color:#3A2600;border-radius:999px;padding:3px 9px}
.legal{font-size:12px;color:var(--muted);text-align:center}
.legal a{color:var(--muted)}
.trust{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.demo{background:var(--gold-tint);color:var(--gold-ink);border-radius:14px;padding:10px 14px;font-size:13px}
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .3s}
.sheet-wrap.on{background:rgba(0,0,0,.4)}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:26px 26px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);justify-self:center}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:12px 14px}
.payrow b{display:block}.payrow small{color:var(--muted);font-size:13px}.payrow strong{font:700 18px/1 var(--display)}
.okbtn{background:var(--good)!important}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;display:inline-block;animation:sp .8s linear infinite}
.spin.dark{border-color:var(--line);border-top-color:var(--a)}
@keyframes sp{to{transform:rotate(360deg)}}
.done{display:grid;justify-items:center;gap:14px;text-align:center;padding-top:10px}
.medal{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#F7CF6E,#D99A1E);display:grid;place-items:center;animation:pop .7s cubic-bezier(.2,1.4,.3,1) both;box-shadow:0 16px 40px rgba(201,138,11,.35)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.steps{display:grid;gap:10px;width:100%;text-align:left}
.step{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.step b{width:32px;height:32px;border-radius:50%;background:var(--sel);color:var(--a);display:grid;place-items:center;font-size:15px}
.upsell{border:2px dashed var(--gold);background:var(--gold-tint);border-radius:20px;padding:16px;display:grid;gap:10px;width:100%;text-align:left}
.upsell .row{display:flex;gap:10px}
.upsell .row>*{flex:1}
.fade{animation:fd .3s ease both}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    if(running){ stop(); return; }
    rec = new SR(); rec.lang = SR_LANG[lang]; rec.continuous = true; rec.interimResults = true;
    rec.onresult = function(e){ interim = ''; for(var i = e.resultIndex; i < e.results.length; i++){ if(e.results[i].isFinal) finalTxt += ' '+e.results[i][0].transcript; else interim += e.results[i][0].transcript; } showLive(); };
    rec.onerror = function(e){ if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){ running = false; clearInterval(tick); mic.classList.remove('rec'); hint.textContent = t('denied'); } };
    rec.onend = function(){ if(running){ try{ rec.start(); }catch(e){} } };
    try{ rec.start(); }catch(e){ hint.textContent = t('nosr'); return; }
    running = true; t0 = Date.now(); left = 10; mic.classList.add('rec'); hint.textContent = t('rec'); track('voice_start');
    tick = setInterval(function(){ left--; tm.textContent = '0:'+String(Math.max(0,left)).padStart(2,'0'); if(left <= 0) stop(); }, 1000);
  };
}
function toks(txt){ return txt.toLowerCase().replace(/[^\p{L}\p{N}\s'’-]/gu,' ').split(/\s+/).filter(Boolean); }
function countFillers(txt, lang){
  var w = toks(txt), s = ' '+w.join(' ')+' ', n = 0;
  FILLERS[lang].forEach(function(f){ var re = new RegExp('(?:^|\\s)'+f.replace(/ /g,'\\s')+'(?=\\s|$)', 'g'); var m = s.match(re); if(m) n += m.length; });
  return {n:n, words:w.length};
}
function highlight(txt, lang){
  var out = esc(txt);
  FILLERS[lang].forEach(function(f){ out = out.replace(new RegExp('(^|\\s)('+f+')(?=[\\s,.!?]|$)', 'gi'), '$1<mark>$2</mark>'); });
  return out;
}
function finish(txt, secs){
  var lang = TRAIN_CODES[A.train || 0], c = countFillers(txt, lang);
  if(c.words < 3){ A.score = null; A.fillers = null; A.wpm = null; }
  else {
    var wpm = Math.round(c.words/secs*60), fpm = c.n/secs*60;
    var s = 78 - Math.min(24, fpm*3) - (wpm > 170 ? Math.min(12, (wpm-170)/4) : 0) - (wpm < 95 ? Math.min(10, (95-wpm)/4) : 0);
    A.score = Math.round(Math.max(42, Math.min(78, s))); A.fillers = c.n; A.wpm = wpm;
  }
  save(); track('voice_done', {score:A.score}); next();
}

/* ---------- analysing → result ---------- */
/* loading screen: a ring that fills, the stages, and what the plan will include — built from the answers */
function analyse(){
  var d = planDays(), fk = focusKey(), goal = t('goals')[A.goal || 0][1], lang = t('trains')[A.train || 0][1], mins = t('mins')[A.mins == null ? 1 : A.mins][0];
  var gets = t('gets')(d, A.when === 3, t('focus')[fk]), R = 52, C = 2*Math.PI*R, DUR = 6500;
  app.innerHTML = frame('<div class="ld"><div class="ld-ring"><svg viewBox="0 0 120 120" width="148" height="148" aria-hidden="true"><circle cx="60" cy="60" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="10"/>'+
      '<circle id="lr" cx="60" cy="60" r="'+R+'" fill="none" stroke="var(--a)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" transform="rotate(-90 60 60)"/></svg><b id="lp">0%</b></div>'+
      '<h1 class="h1 center">'+t('an')+'</h1><div class="ld-chips"><span>'+esc(goal)+'</span><span>'+esc(lang)+'</span><span>'+esc(mins)+'</span></div>'+
      '<p class="small center" id="ls">'+t('ans')[0]+'…</p></div>'+
    '<div class="card"><p class="label">'+t('get_t')+'</p><ul class="gets">'+gets.map(function(g, i){ return '<li id="lg'+i+'"><span class="gi">'+CHECK+'</span><span>'+esc(g)+'</span></li>'; }).join('')+'</ul></div>'+
    '<div class="spacer"></div><button class="btn" type="button" id="nx" disabled>'+t('see')+'</button>', {noBack:true});
  bind();
  var t0 = Date.now(), lr = document.getElementById('lr'), lp = document.getElementById('lp'), ls = document.getElementById('ls'), nx = document.getElementById('nx'), shown = -1;
  nx.onclick = next;
  (function tick(){
    if(STEPS[step] !== 'analyse' || !document.getElementById('lr')) return;
    var k = Math.min(1, (Date.now()-t0)/DUR), e = 1 - Math.pow(1-k, 1.6);
    lr.setAttribute('stroke-dashoffset', (C*(1-e)).toFixed(1)); lp.textContent = Math.round(e*100)+'%';
    ls.textContent = k < 1 ? t('ans')[Math.min(2, Math.floor(e*3))]+'…' : t('ready');
    var g = Math.min(gets.length-1, Math.floor(e*gets.length*1.05) - 1 + (k >= 1 ? 1 : 0));
    while(shown < g){ shown++; var li = document.getElementById('lg'+shown); if(li) li.classList.add('on'); }
    if(k < 1) requestAnimationFrame(tick); else { nx.disabled = false; track('plan_ready'); }
  })();
}
function estScore(){
  if(A.score != null) return A.score;
  return Math.max(48, 70 - A.probs.length*4);   // no voice test: estimate from the self-reported problems
}
function planDays(){ return [7, 14, 28, 28][A.when == null ? 3 : A.when]; }
function focusKey(){
  if(A.fillers != null && A.fillers >= 1) return 'fillers';
  if(A.wpm != null && A.wpm > 170) return 'fast';
  if(A.wpm != null && A.wpm < 95) return 'slow';
  if(A.probs.indexOf(0) >= 0) return 'fillers'; if(A.probs.indexOf(1) >= 0) return 'fast'; if(A.probs.indexOf(2) >= 0) return 'mono';
  return 'ok';
}
function result(){
  var sc = estScore(), d = planDays(), fk = focusKey();
  var W = 320, H = 130, x0 = 20, x1 = W-20, y = function(v){ return H-18 - (v-40)/50*(H-36); };
  var path = 'M'+x0+' '+y(sc)+' C '+(x0+90)+' '+y(sc+2)+', '+(x1-120)+' '+y(78)+', '+x1+' '+y(80);
  var chart = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t('plan_t')(d))+'"><line x1="'+x0+'" x2="'+x1+'" y1="'+y(80)+'" y2="'+y(80)+'" stroke="var(--line2)" stroke-dasharray="4 5"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--a)" stroke-width="4" stroke-linecap="round"/>'+
    '<circle cx="'+x0+'" cy="'+y(sc)+'" r="7" fill="var(--bad)"/><circle cx="'+x1+'" cy="'+y(80)+'" r="8" fill="var(--good)"/>'+
    '<text x="'+x0+'" y="'+(H-2)+'" font-size="12" fill="var(--muted)">'+t('today')+' · '+sc+'%</text><text x="'+x1+'" y="'+(H-2)+'" font-size="12" fill="var(--muted)" text-anchor="end">'+(A.when === 3 ? '' : t('goalday')+' · ')+'80%</text></svg>';
  app.innerHTML = frame('<p class="label">'+t('res')+'</p><div class="card"><div class="score"><span class="now" style="color:'+(sc >= 70 ? 'var(--gold)' : 'var(--bad)')+'">'+sc+'%</span><span class="p" style="padding-bottom:8px">→ 80% · '+t('res_t').toLowerCase()+'</span></div>'+
      '<div class="stats"><div class="stat"><span>'+t('fil')+'</span><b class="'+(A.fillers ? 'bad' : 'good')+'">'+(A.fillers == null ? '—' : A.fillers)+'</b></div>'+
      '<div class="stat"><span>'+t('pace')+'</span><b>'+(A.wpm == null ? '—' : A.wpm)+'</b></div><div class="stat"><span>'+t('fix')+'</span><b style="font-size:15px">'+t('focus')[fk]+'</b></div></div></div>'+
    '<div class="card chart"><p class="h2">'+t('plan_t')(d)+'</p>'+chart+'<p class="small">'+t('est')+'</p></div>'+
    '<div class="spacer"></div><button class="btn" type="button" id="nx">'+t('next')+'</button>', {noBack:false});
  bind(); document.getElementById('nx').onclick = next;
  track('result_view', {score:sc});
}

/* ---------- email ---------- */
function email(){
  app.innerHTML = frame('<h1 class="h1">'+t('em')+'</h1><p class="p">'+t('emp')+'</p>'+
    '<input class="input" id="em" type="email" inputmode="email" autocomplete="email" placeholder="'+t('emph')+'" value="'+esc(A.email||'')+'" aria-label="Email">'+
    '<p class="small" id="eerr" style="color:var(--bad)" hidden>'+t('em_bad')+'</p>'+
    '<label class="check"><input type="checkbox" id="ag"'+(A.agree?' checked':'')+'><span>'+t('agree')+'</span></label>'+
    '<p class="demo">'+t('demo_note')+'</p><div class="spacer"></div><button class="btn" type="button" id="nx">'+t('next')+'</button>');
  bind();
  var em = document.getElementById('em'), ag = document.getElementById('ag'), nx = document.getElementById('nx');
  function ok(){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim()) && ag.checked; }
  function upd(){ nx.disabled = !ok(); }
  em.oninput = upd; ag.onchange = upd; upd();
  nx.onclick = function(){ if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim())){ document.getElementById('eerr').hidden = false; return; } A.email = em.value.trim(); A.agree = true; save(); track('email_done'); next(); };
}

/* ---------- paywall → demo checkout → success ---------- */
var sel = 'quarter';
function paywall(){
  var sc = estScore(), tg = 80;
  app.innerHTML = frame('<h1 class="h1">'+t('pw')+'</h1><p class="p">'+esc(t('pws')(sc, tg))+'</p>'+
    '<div class="pw-bars" aria-hidden="true"><div><span>'+sc+'%</span><i style="height:'+Math.round(sc*1.3)+'px"></i><small>'+t('now')+'</small></div><div><span>'+tg+'%</span><i class="t" style="height:'+Math.round(tg*1.3)+'px"></i><small>'+t('after')+'</small></div></div>'+
    '<ul class="feat">'+t('feats').map(function(f){ return '<li><span class="fi">'+CHECK+'</span><span><b>'+f[0]+'</b><small>'+f[1]+'</small></span></li>'; }).join('')+'</ul>'+
    '<div class="plans" role="radiogroup">'+['week','month','quarter'].map(function(k){ var p = t('plans')[k]; return '<button type="button" class="plan" role="radio" data-p="'+k+'" aria-checked="'+(sel===k)+'">'+(p[2]?'<em>'+p[2]+'</em>':'')+'<span><b>'+p[0]+'</b><small>'+p[1]+'</small></span><strong>$'+PLANS[k].usd+'</strong></button>'; }).join('')+'</div>'+
    '<button class="btn" type="button" id="buy">'+t('get')+'</button><p class="legal">'+esc(t('legal')(sel))+'</p>'+
    '<div class="trust">'+t('trust').map(function(x){ return '<span>✓ '+x+'</span>'; }).join('')+'</div>');
  bind();
  app.querySelectorAll('[data-p]').forEach(function(b){ b.onclick = function(){ sel = b.getAttribute('data-p'); paywall(); }; });
  document.getElementById('buy').onclick = function(){ checkout(sel); };
  track('paywall_view');
}
function sheet(inner){
  var w = document.createElement('div'); w.className = 'sheet-wrap';
  w.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(t('pay_t'))+'"><span class="grab"></span>'+inner+'</div>';
  document.body.appendChild(w); requestAnimationFrame(function(){ w.classList.add('on'); });
  w.close = function(){ w.classList.remove('on'); setTimeout(function(){ w.remove(); }, 300); };
  w.onclick = function(e){ if(e.target === w) w.close(); };
  return w;
}
function checkout(k){
  var p = t('plans')[k], price = '$'+PLANS[k].usd;
  var w = sheet('<b class="h2">'+t('pay_t')+'</b><div class="payrow"><span><b>Speakline Premium · '+p[0]+'</b><small>'+p[1]+'</small></span><strong>'+price+'</strong></div>'+
    '<p class="small">'+esc(A.email)+'</p><p class="demo">'+t('pay_demo')+'</p>'+
    '<button class="btn" type="button" id="pay">'+t('pay_btn')(price)+'</button><button class="link" type="button" id="pc">'+t('cancel')+'</button>');
  track('checkout_open', {plan:k});
  w.querySelector('#pc').onclick = w.close;
  w.querySelector('#pay').onclick = function(){
    var b = w.querySelector('#pay'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    setTimeout(function(){
      activate(k);
      b.classList.add('okbtn'); b.innerHTML = CHECK+' '+t('paid');
      setTimeout(function(){ w.close(); success(k); }, 700);
    }, 1100);
  };
}
/* hand-off: write exactly what the app reads on boot */
function activate(k){
  var now = Date.now(), ui = A.ui, train = TRAIN_CODES[A.train || 0];
  store.set('profile', {ui:ui, train:train, goal:A.goal || 0, pathStart:now});
  store.set('plan', {id:k, ts:now, until:now + PLANS[k].days*864e5, email:A.email, src:'web', demo:true});
  store.set('account', {email:A.email});
  store.set('funnel', {age:A.age, probs:A.probs, when:A.when, mins:A.mins, score:A.score, fillers:A.fillers, wpm:A.wpm, ts:now});
  store.set('welcome', true);
  var tours = store.get('tours', {}); tours.prem = 1; store.set('tours', tours);
  store.set('qstep', 'done');
  track('checkout_done', {plan:k, value:PLANS[k].usd});
}
function success(k){
  var until = new Date(store.get('plan', {}).until || Date.now()).toLocaleDateString(t('loc'), {day:'numeric', month:'long'});
  var addons = store.get('addons', {});
  app.innerHTML = '<div class="top">'+LOGO+'<span></span></div><div class="done fade"><div class="medal" aria-hidden="true"><svg width="48" height="48" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#3A2600" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'+
    '<h1 class="h1 big">'+t('ok')+'</h1><p class="p">'+esc(t('okp')(t('planNames')[k], until))+'</p>'+
    (!addons.pack ? '<div class="upsell" id="up"><b class="h2">'+t('up_t')+'</b><p class="p">'+t('up_p')+'</p><div class="row"><button class="btn ghost" type="button" id="uno">'+t('up_no')+'</button><button class="btn" type="button" id="uyes">'+t('up_yes')+'</button></div></div>' : '')+
    '<div class="steps">'+t('how').map(function(x, i){ return '<div class="step"><b>'+(i+1)+'</b><span>'+x+'</span></div>'; }).join('')+'</div>'+
    '<a class="btn" href="../" id="open" style="text-decoration:none">'+t('open')+'</a></div>';
  var u = document.getElementById('up');
  if(u){
    document.getElementById('uno').onclick = function(){ u.remove(); };
    document.getElementById('uyes').onclick = function(){ var a = store.get('addons', {}); a.pack = true; store.set('addons', a); u.innerHTML = '<p class="h2" style="color:var(--good)">✓ '+t('up_ok')+'</p>'; track('upsell_done'); };
  }
  window.scrollTo(0,0);
}

/* returning visitor who already paid: send them to the app; ?restart starts the quiz again */
if(/[?&]restart/.test(location.search)){ store.set('qstep', 'goal'); store.set('quiz', null); A = {ui:A.ui, goal:null, age:null, probs:[], when:null, train:null, mins:null, score:null, fillers:null, wpm:null, email:''}; step = 0; }
if(store.get('qstep', '') === 'done' && store.get('plan', null)) location.replace('../');
else render();
})();
</script>
