<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speakline Coach</title>
<meta name="theme-color" content="#0B0B0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one centred phone-width column, dark iOS-style app. Screens: onboarding → home (progress) → session (live mic) → result (score, transcript, advice). */
:root{
  --bg:#0B0B0F; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --muted:#8E8E93; --soft:#AEAEB2; --hair:rgba(255,255,255,.08);
  --a:#FF5A36; --b:#FF9F0A; --good:#30D158; --bad:#FF6961; --blue:#0A84FF;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Figtree","Helvetica Neue",Arial,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Figtree","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--text);letter-spacing:-.015em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid rgba(255,159,10,.6);outline-offset:2px;border-radius:12px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.logo{display:flex;gap:8px;align-items:center;font:700 18px/1 var(--display);letter-spacing:-.02em}
.logo i{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer}
.h1{font:700 32px/1.1 var(--display);letter-spacing:-.04em;text-wrap:balance}
.h2{font:700 22px/1.2 var(--display);letter-spacing:-.03em}
.p{color:var(--soft);font-size:15px}
.small{font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:16px;display:grid;gap:10px}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.btn{min-height:54px;border:0;border-radius:16px;background:var(--ink);color:#0B0B0F;font:600 17px/1 var(--text);cursor:pointer;padding:0 18px;width:100%}
.btn.heat{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px;font-size:14px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;min-height:54px;padding:10px 16px;border-radius:16px;border:1.5px solid transparent;background:var(--card);cursor:pointer}
.opt b{display:block;font-weight:600}
.opt small{font-size:12px;color:var(--muted)}
.opt i{width:22px;height:22px;border-radius:50%;border:2px solid #48484A;flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--b);background:#221a10}
.opt[aria-pressed="true"] i{border-color:var(--b);background:var(--b)}
.opt[aria-pressed="true"] i::after{content:"";width:8px;height:8px;border-radius:50%;background:#0B0B0F}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:9px 14px;background:var(--card2);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:#0B0B0F;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px;display:grid;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font:700 24px/1.15 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:12px;color:var(--soft)}
.stat em.bad{color:var(--bad)}.stat em.good{color:var(--good)}.stat em.warn{color:var(--b)}
.streak{display:flex;align-items:center;gap:12px}
.xp{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.xp i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--a),var(--b))}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:0;border-radius:20px;background:var(--card);padding:14px 16px;cursor:pointer}
.mode .ic{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center}
.mode b{display:block;font-weight:600;font-size:16px}
.mode small{color:var(--muted);font-size:13px}
.chev{width:9px;height:9px;border-top:2px solid #636366;border-right:2px solid #636366;transform:rotate(45deg)}
.prompt{font:600 22px/1.35 var(--display);letter-spacing:-.025em}
.wave{width:100%;height:110px;display:block}
.recwrap{display:grid;justify-items:center;gap:10px}
.rec{width:84px;height:84px;border-radius:50%;border:4px solid #fff;background:transparent;position:relative;cursor:pointer}
.rec::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#FF3B30;transition:all .25s}
.rec.on::after{inset:22px;border-radius:7px}
.timer{font:600 20px/1 var(--display);font-variant-numeric:tabular-nums}
.live{min-height:72px;font-size:16px;line-height:1.55;color:var(--ink)}
.live .interim{color:var(--muted)}
.tx{font-size:16px;line-height:1.65;background:var(--card);border-radius:18px;padding:14px 16px}
.tx mark{background:rgba(255,69,58,.22);color:var(--bad);border-radius:5px;padding:0 4px;font-weight:600}
.tx .miss{color:var(--b);text-decoration:underline wavy;text-underline-offset:3px}
.tx .ok{color:var(--ink)}
.ringbox{display:grid;place-items:center;position:relative;width:180px;height:180px;margin:0 auto}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .num{font:700 50px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ringbox .num small{font-size:24px}
.center{text-align:center}
.tip{display:grid;grid-template-columns:36px 1fr;gap:12px;background:var(--card);border-radius:18px;padding:14px}
.tip .n{width:36px;height:36px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--b)}
.tip b{display:block;margin-bottom:2px}
.tip p{color:var(--soft);font-size:14px}
.tip .drill{margin-top:6px;font-size:13px;color:var(--ink);background:var(--card2);border-radius:10px;padding:8px 10px}
.badge{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,rgba(255,90,54,.18),rgba(255,159,10,.18));border:1px solid rgba(255,159,10,.4);border-radius:14px;padding:10px 12px;font-size:14px}
.chart svg{display:block;width:100%;height:auto}
.hist{display:grid;gap:6px}
.hrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:10px 12px;background:var(--card);border-radius:14px}
.hrow span{color:var(--muted)}
.warnbox{background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.35);color:#FFD9A0;border-radius:14px;padding:12px 14px;font-size:14px}
.input{width:100%;min-height:48px;border-radius:14px;border:0;background:var(--card2);padding:0 14px;font-size:15px}
.ai{white-space:pre-wrap;font-size:15px;line-height:1.55;color:var(--ink)}
.row{display:flex;gap:10px}
.row > *{flex:1}

/* splash */
.splash{position:fixed;inset:0;z-index:20;background:radial-gradient(70% 50% at 50% 42%,rgba(255,90,54,.22),transparent 70%),#0B0B0F;display:grid;place-items:center;cursor:pointer;transition:opacity .5s ease}
.splash.out{opacity:0}
.sp-in{display:grid;justify-items:center;gap:22px;text-align:center;padding:0 24px}
.sp-mark{width:112px;height:112px;border-radius:32px;background:linear-gradient(135deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 20px 60px rgba(255,90,54,.35);animation:pop .9s cubic-bezier(.2,1.4,.3,1) both}
.sp-mark i{display:block;width:7px;border-radius:4px;background:#fff;animation:eq 1s ease-in-out infinite}
.sp-mark i:nth-child(1){height:22px;animation-delay:-.2s}.sp-mark i:nth-child(2){height:44px;animation-delay:-.5s}.sp-mark i:nth-child(3){height:64px;animation-delay:-.1s}.sp-mark i:nth-child(4){height:40px;animation-delay:-.7s}.sp-mark i:nth-child(5){height:24px;animation-delay:-.35s}
.sp-word{font:800 40px/1 var(--display);letter-spacing:-.045em;animation:rise .8s .35s both}
.sp-tag{font:500 19px/1.35 var(--display);color:var(--soft);letter-spacing:-.02em;animation:rise .8s .6s both;max-width:22ch}
.sp-bar{width:120px;height:3px;border-radius:2px;background:var(--card2);overflow:hidden;animation:rise .6s .8s both}
.sp-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--a),var(--b));transform-origin:left;animation:load 2.2s .8s linear both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* intro carousel */
.intro{flex:1;display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 60px)}
.intro-view{overflow:hidden;flex:1;touch-action:pan-y}
.intro-track{display:flex;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.slide{flex:0 0 100%;display:flex;flex-direction:column;gap:16px;padding-top:8px}
.ill{background:var(--card);border-radius:28px;min-height:260px;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.ill::before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,159,10,.22),transparent 65%)}
.bubble{position:relative;max-width:88%;background:var(--card2);border-radius:20px 20px 20px 6px;padding:14px 16px;font-size:17px;line-height:1.55}
.bubble mark{background:rgba(255,69,58,.22);color:var(--bad);border-radius:5px;padding:0 4px;font-weight:600}
.bubble.r{border-radius:20px 20px 6px 20px;background:#2a2016;margin-left:auto;font-size:15px;color:#FFD9A0}
.steps{display:grid;gap:10px;width:100%;position:relative}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:var(--card2);border-radius:16px;padding:12px}
.step b{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#fff;font:700 17px/1 var(--display)}
.step span{font-size:15px;line-height:1.4}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--card2);transition:all .3s}
.dots i.on{width:22px;background:var(--b)}
.mini-ring{position:relative;width:150px;height:150px;display:grid;place-items:center}
.mini-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.mini-ring b{font:700 42px/1 var(--display);letter-spacing:-.04em}
.mini-ring small{font-size:20px}
@media (prefers-reduced-motion:reduce){.sp-mark,.sp-mark i,.sp-word,.sp-tag,.sp-bar,.sp-bar i{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function dayKey(ts){ var d = new Date(ts); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function streak(){
  if(!history.length) return 0;
  var days = {}; history.forEach(function(h){ days[dayKey(h.ts)] = 1; });
  var n = 0, d = new Date();
  if(!days[dayKey(d)]) d.setDate(d.getDate()-1);

}

function chart(list){

  var s = '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Оценки по сессиям"><defs><linearGradient id="cl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF5A36"/><stop offset="1" stop-color="#FF9F0A"/></linearGradient></defs>';
  [0,50,100].forEach(function(t){ s += '<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="rgba(255,255,255,.08)"/><text x="2" y="'+(y(t)+4)+'" font-size="9" fill="#8E8E93">'+t+'</text>'; });
  s += '<path d="'+d+'" fill="none" stroke="url(#cl)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  list.forEach(function(h,i){ s += '<circle cx="'+x(i)+'" cy="'+y(h.score)+'" r="'+(i===n-1?5:3)+'" fill="#FF9F0A"/>'; });

  return s;
}

/* ================= recording session ================= */
var ctx = null, media = null;
function session(mode){
  var lang = profile.train, text = mode==='read' ? pick(PHRASES[lang]) : pick(TOPICS[lang]), maxSec = mode==='read' ? 20 : 60;
  app.innerHTML =
    '<div class="top"><button class="icon-btn" type="button" id="bk" aria-label="'+L('home')+'">'+IC.back+'</button><span class="small">'+LANG_NAMES[lang].n+'</span><span class="timer" id="tm">0:00</span></div>'+
    '<p class="label">'+(mode==='read' ? L('read_this') : L('speak_on'))+'</p>'+
    '<p class="prompt">'+(mode==='read' ? '«'+esc(text)+'»' : esc(text))+'</p>'+
    '<canvas class="wave" id="wv" width="900" height="220" aria-hidden="true"></canvas>'+
    '<div class="recwrap"><button class="rec" type="button" id="rec" aria-label="'+L('tap')+'"></button><p class="small" id="st">'+L('tap')+'</p></div>'+
    '<div class="card"><p class="label">'+L('transcript')+'</p><p class="live" id="live"></p></div>'+
    '<p class="small">'+L('hint_um')+'</p>'+
    (SR ? '' : '<p class="warnbox">'+L('no_sr')+'</p>');
  var stopFn = null;
  document.getElementById('bk').onclick = function(){ if(stopFn) stopFn(true); home(); };
  var recBtn = document.getElementById('rec');
  recBtn.onclick = function(){
    if(stopFn){ stopFn(false); return; }
    start(mode, text, maxSec).then(function(fn){ stopFn = fn; }).catch(function(e){
      document.getElementById('st').innerHTML = '<span class="warnbox" style="display:block">'+L('no_mic')+'</span>';
    });
  };
}

function start(mode, text, maxSec){
  var lang = profile.train;
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:false}}).then(function(stream){
    media = stream;
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === 'suspended') ctx.resume();
    var src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser();
    an.fftSize = 2048; src.connect(an);
    var buf = new Float32Array(an.fftSize), sr = ctx.sampleRate;
    var frames = [], t0 = performance.now(), raf = 0, fi = 0;
    var cv = document.getElementById('wv'), g = cv.getContext('2d'), bars = new Array(64).fill(0);
    var finals = [], interim = '', confs = [], recog = null, recording = true;
    var recBtn = document.getElementById('rec'), st = document.getElementById('st'), tm = document.getElementById('tm'), live = document.getElementById('live');
    recBtn.classList.add('on'); st.textContent = L('listening');

    if(SR){
      recog = new SR(); recog.lang = SR_LANG[lang]; recog.continuous = true; recog.interimResults = true; recog.maxAlternatives = 1;
      recog.onresult = function(e){
        interim = '';
        for(var i = e.resultIndex; i < e.results.length; i++){
          var r = e.results[i];
          if(r.isFinal){ finals.push(r[0].transcript.trim()); if(r[0].confidence > 0) confs.push(r[0].confidence); }
          else interim += r[0].transcript;
        }
        live.innerHTML = esc(finals.join(' ')) + ' <span class="interim">'+esc(interim)+'</span>';
      };
      recog.onerror = function(){};
      recog.onend = function(){ if(recording){ try{ recog.start(); }catch(e){} } };
      try{ recog.start(); }catch(e){}
    }

    function loop(){
      an.getFloatTimeDomainData(buf);
      var s = 0; for(var i = 0; i < buf.length; i++) s += buf[i]*buf[i];
      var rms = Math.sqrt(s/buf.length), t = (performance.now()-t0)/1000;
      var f0 = (fi++ % 2 === 0) ? pitch(buf, sr) : 0;
      frames.push({t:t, rms:rms, f0:f0});
      bars.push(rms); bars.shift();
      draw(g, cv, bars);
      var sec = Math.floor(t); tm.textContent = Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
      if(t >= maxSec){ stop(false); return; }
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);

    function stop(abort){
      if(!recording) return; recording = false;
      cancelAnimationFrame(raf);
      try{ stream.getTracks().forEach(function(tr){ tr.stop(); }); }catch(e){}
      recBtn.classList.remove('on'); recBtn.disabled = true;
      if(abort){ try{ recog && recog.abort(); }catch(e){} return; }
      st.textContent = L('analysing');
      var done = false;
      var finish = function(){ if(done) return; done = true;
        var transcript = (finals.join(' ') + ' ' + interim).trim();
        result(analyse({mode:mode, lang:lang, ref:mode==='read'?text:null, prompt:text, frames:frames, transcript:transcript, confs:confs}));
      };
      if(recog){ recog.onend = finish; try{ recog.stop(); }catch(e){ finish(); } setTimeout(finish, 2500); } else finish();
    }
    return stop;
  });
}

function draw(g, cv, bars){
  var W = cv.width, H = cv.height, n = bars.length, bw = W/n;
  g.clearRect(0,0,W,H);
  var grad = g.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#FF9F0A'); grad.addColorStop(1,'#FF5A36');
  g.fillStyle = grad;
  for(var i = 0; i < n; i++){
    var h = Math.max(6, Math.min(H, Math.sqrt(bars[i])*H*2.2));
    var x = i*bw + bw*0.25, w = bw*0.5, yv = (H-h)/2;
    g.beginPath(); if(g.roundRect) g.roundRect(x, yv, w, h, w/2); else g.rect(x, yv, w, h); g.fill();
  }
}

/* autocorrelation pitch on a 2x-downsampled window; returns Hz or 0 */
function pitch(buf, sr){
  var N = buf.length >> 1, x = new Float32Array(N), e = 0;
  for(var i = 0; i < N; i++){ x[i] = buf[2*i]; e += x[i]*x[i]; }
  if(Math.sqrt(e/N) < 0.01) return 0;
  var fs = sr/2, minLag = Math.floor(fs/400), maxLag = Math.floor(fs/70), best = 0, bestLag = 0;
  for(var lag = minLag; lag <= maxLag; lag++){
    var c = 0; for(var j = 0; j < N-lag; j++) c += x[j]*x[j+lag];
    if(c > best){ best = c; bestLag = lag; }
  }
  if(!bestLag || best/e < 0.45) return 0;
  return fs/bestLag;
}

/* ================= analysis ================= */
function pct(arr, p){ if(!arr.length) return 0; var a = arr.slice().sort(function(x,y){return x-y;}); return a[Math.min(a.length-1, Math.floor(p*a.length))]; }
function analyse(o){
  var fr = o.frames, rms = fr.map(function(f){ return f.rms; });
  var floor = pct(rms, .15), loud = pct(rms, .9), thr = Math.max(0.006, floor + (loud-floor)*0.18);
  // voiced segments with 120 ms gap smoothing
  var segs = [], cur = null;
  fr.forEach(function(f){
    if(f.rms > thr){ if(cur && f.t - cur.e < 0.12){ cur.e = f.t; } else { cur = {s:f.t, e:f.t}; segs.push(cur); } }
  });
  segs = segs.filter(function(s){ return s.e - s.s > 0.06; });
  var speech = segs.length ? segs[segs.length-1].e - segs[0].s : 0;
  var pauses = [];
  for(var i = 1; i < segs.length; i++){ var g = segs[i].s - segs[i-1].e; if(g >= 0.25) pauses.push(g); }
  var longP = pauses.filter(function(p){ return p > 2; }).length;
  var avgP = pauses.length ? pauses.reduce(function(a,b){return a+b;},0)/pauses.length : 0;
  // pitch variability in semitones
  var st = fr.filter(function(f){ return f.f0 > 0 && f.rms > thr; }).map(function(f){ return 12*Math.log2(f.f0/100); });
  var med = pct(st, .5); st = st.filter(function(v){ return Math.abs(v-med) < 10; });
  var mean = st.reduce(function(a,b){return a+b;},0)/(st.length||1);
  var sd = st.length > 10 ? Math.sqrt(st.reduce(function(a,b){ return a+(b-mean)*(b-mean); },0)/st.length) : null;
  var voicedDb = 20*Math.log10(Math.max(1e-6, pct(fr.filter(function(f){ return f.rms > thr; }).map(function(f){ return f.rms; }), .5)));
  // words and fillers
  var raw = o.transcript.split(/\s+/).filter(Boolean), ws = raw.map(norm);
  var fill = FILLERS[o.lang], marks = new Array(ws.length).fill(false), nF = 0;
  for(var k = 0; k < ws.length; k++){
    for(var m = 0; m < fill.length; m++){
      var parts = fill[m].split(' ');
      if(parts.every(function(p, j){ return ws[k+j] === p; })){ for(var j2 = 0; j2 < parts.length; j2++) marks[k+j2] = true; nF++; k += parts.length-1; break; }
    }
  }
  // repeated words ("the the")
  var reps = 0; for(var r = 1; r < ws.length; r++) if(ws[r] && ws[r] === ws[r-1] && !marks[r]) reps++;
  var minutes = Math.max(speech, 1)/60;
  var nW = ws.length, wpm = nW/minutes, fpm = nF/minutes;
  // read-aloud accuracy by word alignment
  var acc = null, refMarks = null;
  if(o.ref){
    var ref = words(o.ref), hyp = ws.filter(function(w,i){ return !marks[i]; });
    var D = [], n = ref.length, mm = hyp.length;
    for(var a = 0; a <= n; a++){ D[a] = [a]; }
    for(var b = 1; b <= mm; b++) D[0][b] = b;
    for(a = 1; a <= n; a++) for(b = 1; b <= mm; b++) D[a][b] = Math.min(D[a-1][b]+1, D[a][b-1]+1, D[a-1][b-1] + (ref[a-1]===hyp[b-1] ? 0 : 1));
    refMarks = new Array(n).fill(false); a = n; b = mm; var match = 0;
    while(a > 0 && b > 0){
      if(ref[a-1]===hyp[b-1] && D[a][b]===D[a-1][b-1]){ refMarks[a-1] = true; match++; a--; b--; }
      else if(D[a][b]===D[a-1][b-1]+1){ a--; b--; }
      else if(D[a][b]===D[a-1][b]+1){ a--; }
      else b--;
    }
    acc = n ? match/n : null;
  }
  var conf = o.confs.length ? o.confs.reduce(function(x,y){return x+y;},0)/o.confs.length : null;

  // component scores 0..100
  var band = PACE[o.lang], sPace = wpm < band[0] ? 100 - (band[0]-wpm)*2 : wpm > band[1] ? 100 - (wpm-band[1])*2.2 : 100;
  var sFill = 100 - fpm*12 - reps*4;
  var ppm = pauses.length/minutes;
  var sPause = 100 - Math.max(0, 4-ppm)*12 - longP*12 - (avgP > 1.4 ? (avgP-1.4)*30 : 0);
  var sInt = sd==null ? null : sd >= 3 ? 100 : sd <= .8 ? 20 : 20 + (sd-.8)/(3-.8)*80;
  var sAcc = acc==null ? null : acc*100, sConf = conf==null ? null : clamp((conf-.55)/.4*100, 0, 100);
  var W = o.mode==='read' ? {pace:.25, fill:.15, pause:.15, int:.15, acc:.30} : {pace:.25, fill:.30, pause:.15, int:.15, conf:.15};
  var parts2 = {pace:sPace, fill:sFill, pause:sPause, int:sInt, acc:sAcc, conf:sConf}, sum = 0, wsum = 0;
  Object.keys(W).forEach(function(key){ var v = parts2[key]; if(v!=null){ sum += clamp(v,0,100)*W[key]; wsum += W[key]; } });
  var score = Math.round(clamp(sum/(wsum||1), 0, 100));
  if(voicedDb < -42) score = Math.max(0, score-5);

  // advice: weakest areas first
  var issues = [];
  if(sFill < 85 && nF > 0) issues.push({k:'fillers', v:sFill});
  if(wpm > band[1]) issues.push({k:'fast', v:sPace}); else if(wpm < band[0]) issues.push({k:'slow', v:sPace});
  if(longP > 0) issues.push({k:'longpause', v:100-longP*12});
  else if(ppm < 4 && speech > 8) issues.push({k:'nopause', v:sPause});
  if(sInt!=null && sInt < 70) issues.push({k:'mono', v:sInt});
  if(sAcc!=null && sAcc < 85) issues.push({k:'acc', v:sAcc});
  if(voicedDb < -42) issues.push({k:'quiet', v:60});
  issues.sort(function(x,y){ return x.v - y.v; });
  if(!issues.length) issues.push({k:'great', v:100});

  return {mode:o.mode, lang:o.lang, prompt:o.prompt, ref:o.ref, refMarks:refMarks, raw:raw, marks:marks, nW:nW, nF:nF, reps:reps, speech:speech,
    wpm:wpm, fpm:fpm, pauses:pauses.length, avgP:avgP, longP:longP, sd:sd, acc:acc, conf:conf, db:voicedDb, score:score, band:band, issues:issues.slice(0,3), tooShort: speech < 3 || nW < 4};
}
window.__analyse = analyse; window.__pitch = pitch;

/* ================= result ================= */
function result(r){
  if(r.tooShort){
    app.innerHTML = '<div class="top"><button class="icon-btn" type="button" id="bk">'+IC.back+'</button><span></span><span></span></div><p class="warnbox">'+L('too_short')+'</p><button class="btn heat" type="button" id="ag">'+L('again')+'</button>';
    document.getElementById('bk').onclick = home; document.getElementById('ag').onclick = function(){ session(r.mode); }; return;
  }
  var mine = history.filter(function(h){ return h.lang===r.lang; }), prev = mine[mine.length-1];
  var xp = Math.round(r.score/2) + 10 + (prev && r.score > prev.score ? 10 : 0);
  var lvBefore = levelOf(totalXP()).i;
  var stBefore = streak();
  history.push({ts:Date.now(), mode:r.mode, lang:r.lang, score:r.score, wpm:Math.round(r.wpm), fpm:r.fpm, xp:xp});
  store.set('history', history);
  var lvAfter = levelOf(totalXP()).i, stAfter = streak();
  var badge = lvAfter > lvBefore ? L('level')+' '+(lvAfter+1)+' · '+L('lv')[lvAfter] : (stAfter > stBefore && stAfter > 1 ? L('streak')(stAfter) : (r.nF===0 ? (profile.ui==='ru'?'Ни одного паразита':profile.ui==='kk'?'Бірде-бір арам сөз жоқ':'Zero filler words') : null));
  var band = r.band;
  var paceTag = r.wpm > band[1] ? ['bad', L('fast')] : r.wpm < band[0] ? ['warn', L('slow')] : ['good', L('ok')];
  var tx = r.raw.map(function(w,i){ return r.marks[i] ? '<mark>'+esc(w)+'</mark>' : esc(w); }).join(' ');
  var refHtml = r.ref ? r.ref.split(/\s+/).filter(function(t){ return norm(t); }).map(function(t,i){ return '<span class="'+(r.refMarks[i]?'ok':'miss')+'">'+esc(t)+'</span>'; }).join(' ') : '';
  var tips = r.issues.map(function(is, i){ var a = ADVICE[is.k][profile.ui]; return '<div class="tip"><span class="n">'+(i+1)+'</span><div><b>'+a[0]+'</b><p>'+a[1]+'</p><p class="drill">'+a[2].replace('{lo}', band[0]).replace('{hi}', band[1])+'</p></div></div>'; }).join('');
  app.innerHTML =
    '<div class="top"><button class="icon-btn" type="button" id="bk" aria-label="'+L('home')+'">'+IC.back+'</button><span class="small">'+LANG_NAMES[r.lang].n+' · '+(r.mode==='read'?L('m_read'):L('m_free'))+'</span><span style="width:40px"></span></div>'+
    '<div class="ringbox"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A36"/><stop offset="1" stop-color="#FF9F0A"/></linearGradient></defs><circle cx="60" cy="60" r="52" fill="none" stroke="#2C2C2E" stroke-width="10"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><span class="num"><span id="num">0</span><small>%</small></span></div>'+
    '<div class="center"><p class="h2">'+L('sound')(r.score)+'</p><p class="small" style="margin-top:4px;color:'+(prev && r.score>=prev.score?'#30D158':'#8E8E93')+'">'+(prev ? L('vs')(r.score-prev.score) : L('first'))+' · '+L('got_xp')(xp)+'</p></div>'+
    (badge ? '<div class="badge"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="10" r="6" stroke="#FF9F0A" stroke-width="2"/><path d="M8.5 15l-1.5 6 5-2.5 5 2.5-1.5-6" stroke="#FF9F0A" stroke-width="2" stroke-linejoin="round"/></svg><span><b>'+L('badge')+':</b> '+esc(badge)+'</span></div>' : '')+
    '<div class="grid2">'+
      stat(L('pace'), Math.round(r.wpm)+' '+L('wpm'), L('target')+' '+band[0]+'–'+band[1]+' · '+paceTag[1], paceTag[0])+
      stat(L('fillers'), fmt1(r.fpm)+' '+L('per_min'), r.nF ? r.nF+' × '+uniqFillers(r) : L('none'), r.fpm > 3 ? 'bad' : r.fpm > 1 ? 'warn' : 'good')+
      stat(L('pauses'), String(r.pauses), r.longP ? L('long_p')(r.longP) : L('avg')+' '+fmt1(r.avgP)+' '+(profile.ui==='en'?'s':'с'), r.longP ? 'warn' : 'good')+
      (r.sd==null ? stat(L('inton'), '—', '', '') : stat(L('inton'), fmt1(r.sd)+' '+L('st'), r.sd < 1.5 ? L('mono') : L('lively'), r.sd < 1.5 ? 'warn' : 'good'))+
      (r.acc!=null ? stat(L('acc'), Math.round(r.acc*100)+'%', '', r.acc < .85 ? 'warn' : 'good') : '')+
      (r.conf!=null ? stat(L('clar'), Math.round(r.conf*100)+'%', '', r.conf < .75 ? 'warn' : 'good') : '')+
    '</div>'+
    '<p class="label">'+L('tips')+'</p>'+tips+
    '<p class="label">'+L('transcript')+'</p><p class="tx">'+(tx || '—')+'</p>'+
    (r.ref ? '<p class="tx">'+refHtml+'</p><p class="small">'+L('ref_hint')+'</p>' : '')+
    (aiKey ? '<button class="btn ghost" type="button" id="ai">'+L('ai_btn')+'</button><div class="card" id="aibox" hidden><p class="ai" id="aitx"></p></div>' : '')+
    '<div class="row"><button class="btn ghost" type="button" id="hm">'+L('home')+'</button><button class="btn heat" type="button" id="ag">'+L('again')+'</button></div>';
  // score animation
  var arc = document.getElementById('arc'), num = document.getElementById('num'), C = 326.7, to = r.score;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var setv = function(v){ num.textContent = Math.round(v); arc.setAttribute('stroke-dashoffset', (C*(1-v/100)).toFixed(1)); };
  if(reduce) setv(to); else { var t0 = null; var tick = function(ts){ if(!t0) t0 = ts; var k = Math.min(1,(ts-t0)/1200); setv(to*(1-Math.pow(1-k,3))); if(k < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
  document.getElementById('bk').onclick = home; document.getElementById('hm').onclick = home;
  document.getElementById('ag').onclick = function(){ session(r.mode); };
  var aiBtn = document.getElementById('ai'); if(aiBtn) aiBtn.onclick = function(){ aiReview(r, aiBtn); };
}
function stat(k, v, e, cls){ return '<div class="stat"><span>'+k+'</span><b>'+v+'</b>'+(e?'<em class="'+cls+'">'+esc(e)+'</em>':'')+'</div>'; }
function uniqFillers(r){ var u = {}; r.raw.forEach(function(w,i){ if(r.marks[i]) u[norm(w)] = 1; }); return Object.keys(u).slice(0,3).map(function(w){ return '«'+w+'»'; }).join(', '); }

/* ================= optional AI coach (user’s own Claude API key) ================= */
function aiReview(r, btn){
  var box = document.getElementById('aibox'), out = document.getElementById('aitx');
  box.hidden = false; out.textContent = L('ai_wait'); btn.disabled = true;
  var uiName = {ru:'Russian', en:'English', kk:'Kazakh'}[profile.ui], trName = {ru:'Russian', en:'English', kk:'Kazakh'}[r.lang];
  var metrics = {mode:r.mode, task:r.prompt, words:r.nW, seconds:Math.round(r.speech), wpm:Math.round(r.wpm), target_wpm:r.band, fillers:r.nF, fillers_per_min:+r.fpm.toFixed(1),
    pauses:r.pauses, avg_pause_s:+r.avgP.toFixed(2), long_pauses:r.longP, pitch_sd_semitones:r.sd==null?null:+r.sd.toFixed(1), read_accuracy:r.acc, score:r.score};
  var prompt = 'You are a speaking coach. The user spoke in '+trName+'. Transcript from speech recognition (filler sounds like "um" may be missing): """'+r.raw.join(' ')+'"""\nMeasured metrics: '+JSON.stringify(metrics)+
    '\nReply in '+uiName+', plain text, no markdown headings. Give: 1) one sentence on what already works; 2) three specific, actionable tips tied to the metrics and the actual words used; 3) a rewritten version of what they said — clearer, without fillers, same meaning, in '+trName+'. Keep it under 180 words.';
  fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'content-type':'application/json','x-api-key':aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({model:'claude-sonnet-5-5', max_tokens:700, messages:[{role:'user', content:prompt}]})})
  .then(function(res){ if(!res.ok) throw new Error(res.status); return res.json(); })
  .then(function(j){ out.textContent = (j.content||[]).map(function(c){ return c.text||''; }).join('').trim() || L('ai_err'); })
  .catch(function(){ out.textContent = L('ai_err'); })
  .then(function(){ btn.disabled = false; });
}

/* ================= boot ================= */
document.documentElement.lang = (profile && profile.ui) || 'ru';
splash(function(){ if(profile) home(); else intro(); });
})();
</script>
