<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speakline Coach</title>
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one centred phone-width column. Light, Apple-like surface by default, dark when the system asks for it.
   Palette: deep "trust" blue as the only action colour, gold only for rewards and levels, red only for fillers. */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --card2:#F2F2F5; --ink:#1D1D1F; --on-ink:#FFFFFF; --muted:#86868B; --soft:#515154;
  --hair:rgba(0,0,0,.06); --line:#E3E3E8; --line2:#C7C7CC;
  --a:#0A5BD8; --b:#3D8BFF; --sel:#EDF4FF; --ring:rgba(10,91,216,.35);
  --gold:#C98A0B; --gold2:#F2B53A; --gold-ink:#8A5A00; --gold-tint:#FFF6E2; --gold-line:#F0D28C;
  --warn:#B25E00; --warn-tint:#FFF3E0;
  --good:#1E9E57; --bad:#D93025; --blue:#0A5BD8;
  --navy:#0B1B33; --navy2:#0E2E63;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(17,24,39,.05);
  --shadow2:0 18px 50px rgba(11,27,51,.22);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --on-ink:#000000; --muted:#8E8E93; --soft:#C7C7CC;
    --hair:rgba(255,255,255,.08); --line:#2C2C2E; --line2:#48484A;
    --a:#3D86FF; --b:#7FB2FF; --sel:#0E2547; --ring:rgba(61,134,255,.45);
    --gold:#F2B53A; --gold2:#FFD27A; --gold-ink:#FFD27A; --gold-tint:#2A2212; --gold-line:#5C4818;
    --warn:#FFB340; --warn-tint:#2A1F0E;
    --good:#30D158; --bad:#FF6961; --blue:#3D86FF;
    --navy:#0B1B33; --navy2:#123A7A;
    --shadow:none; --shadow2:0 18px 50px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.47 var(--text);letter-spacing:-.016em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:12px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.logo{display:flex;gap:8px;align-items:center;font:700 19px/1 var(--display);letter-spacing:-.025em}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--navy2),var(--a));display:grid;place-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.h1{font:700 34px/1.08 var(--display);letter-spacing:-.035em;text-wrap:balance}
.h2{font:700 23px/1.18 var(--display);letter-spacing:-.03em}
.p{color:var(--soft);font-size:15px}
.small{font-size:12.5px;color:var(--muted)}
.card{background:var(--card);border-radius:22px;padding:18px;display:grid;gap:10px;box-shadow:var(--shadow)}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.btn{min-height:54px;border:0;border-radius:999px;background:var(--ink);color:var(--on-ink);font:600 17px/1 var(--text);cursor:pointer;padding:0 22px;width:100%;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.heat{background:var(--a);color:#fff}
.btn.heat:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--card2);color:var(--a)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--a);cursor:pointer;padding:8px;font-size:15px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;min-height:56px;padding:10px 16px;border-radius:18px;border:1.5px solid transparent;background:var(--card);box-shadow:var(--shadow);cursor:pointer}
.opt b{display:block;font-weight:600}
.opt small{font-size:12.5px;color:var(--muted)}
.opt i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--a);background:var(--sel)}
.opt[aria-pressed="true"] i{border-color:var(--a);background:var(--a)}
.opt[aria-pressed="true"] i::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:9px 14px;background:var(--card2);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pro-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pro-tile{display:grid;gap:4px;align-content:start;text-align:left;border:0;border-radius:16px;padding:12px;background:var(--card2);cursor:pointer;font:inherit;color:inherit;min-height:104px}
.pro-tile b{font-size:14.5px;line-height:1.25}
.pro-tile small{font-size:12px;color:var(--muted);line-height:1.3}
.pro-tile.dim{opacity:.62}
.pro-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font:700 16px/1 var(--display);margin-bottom:4px}
.pro-ic.big{width:56px;height:56px;border-radius:16px;font-size:26px;flex:none}
.pro-head{display:flex;gap:14px;align-items:flex-start}
.pro-head .h1{font-size:28px}
.prompt.sm{font-size:19px}

.stat{background:var(--card);border-radius:20px;padding:16px;display:grid;gap:2px;min-width:0;box-shadow:var(--shadow)}
.stat span{font-size:12.5px;color:var(--muted)}
.stat b{font:700 26px/1.15 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:12px;color:var(--soft)}
.stat em.bad{color:var(--bad)}.stat em.good{color:var(--good)}.stat em.warn{color:var(--warn)}
.streak{display:flex;align-items:center;gap:12px}
.xp{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.xp i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--a),var(--b))}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:0;border-radius:20px;background:var(--card);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer}
.mode .ic{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--navy2),var(--a));display:grid;place-items:center}
.mode b{display:block;font-weight:600;font-size:16px}
.mode small{color:var(--muted);font-size:13px}
.chev{width:9px;height:9px;border-top:2px solid var(--line2);border-right:2px solid var(--line2);transform:rotate(45deg)}
.prompt{font:600 23px/1.38 var(--display);letter-spacing:-.025em}
.wave{width:100%;height:110px;display:block}
.recwrap{display:grid;justify-items:center;gap:10px}
.rec{width:84px;height:84px;border-radius:50%;border:4px solid var(--ink);background:transparent;position:relative;cursor:pointer}
.rec::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#FF3B30;transition:all .25s}
.rec.on::after{inset:22px;border-radius:7px}
.timer{font:600 20px/1 var(--display);font-variant-numeric:tabular-nums}
.live{min-height:72px;font-size:16px;line-height:1.55;color:var(--ink)}
.live .interim{color:var(--muted)}
.srst{min-height:0;color:var(--warn);text-align:center}
.srst.on{min-height:18px}
.tx mark.hes{background:rgba(217,48,37,.08);border:1px dashed rgba(217,48,37,.55);font-style:italic}
.dbg{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre-wrap}
.tx{font-size:16px;line-height:1.65;background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.tx mark{background:rgba(217,48,37,.12);color:var(--bad);border-radius:5px;padding:0 4px;font-weight:600}
.tx .miss{color:var(--warn);text-decoration:underline wavy;text-underline-offset:3px}
.tx .ok{color:var(--ink)}
.ringbox{display:grid;place-items:center;position:relative;width:180px;height:180px;margin:0 auto}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .num{font:700 52px/1 var(--display);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.ringbox .num small{font-size:24px}
.center{text-align:center}
.tip{display:grid;grid-template-columns:36px 1fr;gap:12px;background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.tip .n{width:36px;height:36px;border-radius:11px;background:var(--sel);display:grid;place-items:center;font-weight:700;color:var(--a)}
.tip b{display:block;margin-bottom:2px}
.tip p{color:var(--soft);font-size:14px}
.tip .drill{margin-top:6px;font-size:13px;color:var(--ink);background:var(--card2);border-radius:10px;padding:8px 10px}
.badge{display:flex;gap:10px;align-items:center;background:var(--gold-tint);border:1px solid var(--gold-line);color:var(--gold-ink);border-radius:14px;padding:10px 12px;font-size:14px}
.chart svg{display:block;width:100%;height:auto}
.hist{display:grid;gap:6px}
.hrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:10px 12px;background:var(--card);border-radius:14px}
.hrow span{color:var(--muted)}
.warnbox{background:var(--warn-tint);border:1px solid rgba(178,94,0,.25);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px}
.input{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
.input:focus{border-color:var(--a);outline:0;box-shadow:0 0 0 4px var(--ring)}
.ai{white-space:pre-wrap;font-size:15px;line-height:1.55;color:var(--ink)}
.ailock{width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit}
.ailock .lockpill{justify-self:start}
.row{display:flex;gap:10px}
.row > *{flex:1}

/* splash */
.splash{position:fixed;inset:0;z-index:20;background:radial-gradient(60% 45% at 50% 40%,rgba(10,91,216,.16),transparent 70%),var(--bg);display:grid;place-items:center;cursor:pointer;transition:opacity .5s ease}
.splash.out{opacity:0}
.sp-in{display:grid;justify-items:center;gap:22px;text-align:center;padding:0 24px}
.sp-mark{width:112px;height:112px;border-radius:30px;background:linear-gradient(135deg,var(--navy2),var(--a));display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 22px 60px rgba(10,91,216,.35);animation:pop .9s cubic-bezier(.2,1.4,.3,1) both}
.sp-mark i{display:block;width:7px;border-radius:4px;background:#fff;animation:eq 1s ease-in-out infinite}
.sp-mark i:nth-child(1){height:22px;animation-delay:-.2s}.sp-mark i:nth-child(2){height:44px;animation-delay:-.5s}.sp-mark i:nth-child(3){height:64px;animation-delay:-.1s;background:var(--gold2)}.sp-mark i:nth-child(4){height:40px;animation-delay:-.7s}.sp-mark i:nth-child(5){height:24px;animation-delay:-.35s}
.sp-word{font:700 44px/1 var(--display);letter-spacing:-.05em;animation:rise .8s .35s both}
.sp-tag{font:500 19px/1.35 var(--display);color:var(--muted);letter-spacing:-.02em;animation:rise .8s .6s both;max-width:22ch}
.sp-bar{width:120px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;animation:rise .6s .8s both}
.sp-bar i{display:block;height:100%;width:100%;background:var(--a);transform-origin:left;animation:load 2.2s .8s linear both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* intro carousel */
.intro{flex:1;display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 60px)}
.intro-view{overflow:hidden;flex:1;touch-action:pan-y}
.intro-track{display:flex;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.slide{flex:0 0 100%;display:flex;flex-direction:column;gap:16px;padding-top:8px}
.ill{background:var(--card);box-shadow:var(--shadow);border-radius:30px;min-height:260px;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.ill::before{content:"";position:absolute;inset:-40% -20% auto auto;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(10,91,216,.12),transparent 65%)}
.bubble{position:relative;max-width:88%;background:var(--card2);border-radius:20px 20px 20px 6px;padding:14px 16px;font-size:17px;line-height:1.55}
.bubble mark{background:rgba(217,48,37,.12);color:var(--bad);border-radius:5px;padding:0 4px;font-weight:600}
.bubble.r{border-radius:20px 20px 6px 20px;background:var(--sel);margin-left:auto;font-size:15px;color:var(--a)}
.steps{display:grid;gap:10px;width:100%;position:relative}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:var(--card2);border-radius:16px;padding:12px}
.step b{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--navy2),var(--a));display:grid;place-items:center;color:#fff;font:700 17px/1 var(--display)}
.step span{font-size:15px;line-height:1.4}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:all .3s}
.dots i.on{width:22px;background:var(--a)}
.mini-ring{position:relative;width:150px;height:150px;display:grid;place-items:center}
.mini-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.mini-ring b{font:700 42px/1 var(--display);letter-spacing:-.04em}
.mini-ring small{font-size:20px}
@media (prefers-reduced-motion:reduce){.sp-mark,.sp-mark i,.sp-word,.sp-tag,.sp-bar,.sp-bar i{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* journey: hero, missions, path, paywall, tours */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px;display:grid;gap:14px;color:#fff;
  background:radial-gradient(90% 70% at 100% 0%,rgba(242,181,58,.28),transparent 55%),radial-gradient(80% 80% at 0% 100%,rgba(61,139,255,.35),transparent 60%),linear-gradient(150deg,var(--navy) 0%,var(--navy2) 60%,#0A4FBF 100%);box-shadow:var(--shadow2)}
.hero-l{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2)}
.hero-t{font:700 29px/1.08 var(--display);letter-spacing:-.04em;text-wrap:balance;margin-top:-6px}
.hero-row{display:flex;gap:16px;align-items:center}
.hero-k{font-weight:600;font-size:15px}
.hero-v{font:700 20px/1.15 var(--display);letter-spacing:-.03em}
.hero-r{display:flex;gap:6px;align-items:center;font-size:13px;opacity:.9;margin-top:8px}
.hero-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:8px}
.hero-bar i{display:block;height:100%;background:linear-gradient(90deg,#fff,var(--gold2));border-radius:3px}
.hero-chips{display:flex;flex-wrap:wrap;gap:6px}
.hero-chips span{display:inline-flex;gap:5px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:600}
.pring{position:relative;flex:none;display:grid;place-items:center}
.pring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.pring b{font:700 26px/1 var(--display);letter-spacing:-.04em;display:grid;place-items:center}
.pring b small{font-size:14px}
.btn.white{background:#fff;color:#0B1B33}
.mcard{background:var(--card);border-radius:24px;padding:20px;display:grid;gap:10px;box-shadow:var(--shadow);border:1px solid rgba(10,91,216,.18)}
.mcard.locked{border-color:var(--hair)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mreward{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--gold-ink);background:var(--gold-tint);border-radius:12px;padding:8px 10px}
.lockpill{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--card2);border-radius:999px;padding:4px 9px}
.planpill{border:0;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#F7CF6E,#D99A1E);color:#3A2600;display:inline-flex;gap:5px;align-items:center}
.planpill.on{background:var(--card);color:var(--gold);box-shadow:var(--shadow)}
.path{list-style:none;margin:0;padding:0;display:grid;gap:0}
.pn{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:14px}
.pn:last-child{padding-bottom:0}
.pn::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.pn:last-child::before{display:none}
.pn.done::before{background:var(--a)}
.pn .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-weight:700;font-size:14px;color:var(--muted)}
.pn.done .dot{background:var(--a)}
.pn.cur .dot{background:var(--card);color:var(--a);box-shadow:inset 0 0 0 2px var(--a),0 0 0 5px var(--ring)}
.pn.fin .dot{background:var(--gold-tint)}
.pn b{display:block;font-size:15px;font-weight:600;padding-top:6px}
.pn small{color:var(--muted);font-size:12.5px}
.pn.todo b{color:var(--soft)}
.today{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:20px;padding:12px 14px;background:var(--a);color:#fff;cursor:pointer}
.today svg{background:rgba(255,255,255,.2);border-radius:11px;padding:9px;width:40px;height:40px}
.today b{display:block}.today small{opacity:.85;font-size:13px}
.today .chev{border-color:#fff}
.mlist{display:grid;gap:8px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:10px 12px}
.mrow b{display:block;font-size:15px}.mrow small{color:var(--muted);font-size:12.5px}
.mrow .chip{background:var(--ink);color:var(--on-ink);font-weight:600}
#mform{display:grid;gap:8px}
.chip.dim{opacity:.55}
.hrow2{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:16px;padding:10px 12px;background:var(--card2);cursor:pointer}
.card .hrow2{background:var(--card2)}
.hist > .hrow2{background:var(--card);box-shadow:var(--shadow)}
.card .hist > .hrow2{background:var(--card2);box-shadow:none}
.hmid b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmid{min-width:0}.hmid small{color:var(--muted);font-size:12.5px}
.sc{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font:700 17px/1 var(--display);font-variant-numeric:tabular-nums}
.sc.good{background:rgba(30,158,87,.12);color:var(--good)}.sc.warn{background:var(--warn-tint);color:var(--warn)}.sc.bad{background:rgba(217,48,37,.1);color:var(--bad)}
.sc.big{width:76px;height:76px;border-radius:22px;font-size:24px}
.dhead{display:flex;gap:14px;align-items:center}
.dhead b{font-size:17px}
.tipsbox{display:grid;gap:10px}
.sticky{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0 calc(4px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.sticky > *{flex:1}
.sticky .btn.heat{flex:1.6}
/* reward */
.celebrate{flex:1;display:grid;align-content:center;justify-items:center;gap:16px;text-align:center;min-height:calc(100vh - 60px)}
.medal{animation:pop .8s cubic-bezier(.2,1.4,.3,1) both;filter:drop-shadow(0 16px 40px rgba(201,138,11,.35))}
.medal svg{width:120px;height:120px}
.cert{width:100%;border-radius:22px;padding:20px;background:linear-gradient(140deg,var(--gold-tint),var(--card));border:1px solid var(--gold-line);display:grid;gap:6px}
.cert-t{font:700 20px/1.3 var(--display);letter-spacing:-.02em;color:var(--gold-ink)}
.cprog{width:100%;display:grid;gap:8px}
.cprog .hero-bar{background:var(--line)}
.cprog .hero-bar i{background:linear-gradient(90deg,var(--a),var(--b))}
.celebrate .btn{max-width:420px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
/* paywall */
.pw-hero{display:grid;gap:10px}
.pw-bars{display:flex;gap:14px;align-items:flex-end;padding:0 4px}
.pw-bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;position:relative}
.pw-bars i{display:block;width:100%;border-radius:12px 12px 6px 6px;background:var(--line)}
.pw-bars i.t{background:linear-gradient(180deg,var(--b),var(--a))}
.pw-bars span{font:700 18px/1 var(--display)}
.pw-bars small{font-size:12px;color:var(--muted)}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feat li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center}
.feat .fi{width:28px;height:28px;border-radius:50%;background:var(--a);display:grid;place-items:center}
.feat b{display:block;font-size:15px}.feat small{color:var(--muted);font-size:13px}
.plans{display:grid;gap:8px}
.plan{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;min-height:66px;padding:12px 16px;border-radius:18px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.plan[aria-checked="true"]{border-color:var(--a);background:var(--sel)}
.plan b{display:block;font-size:16px}.plan small{color:var(--muted);font-size:13px}
.plan strong{font:700 18px/1 var(--display)}
.plan em{position:absolute;top:-10px;right:14px;font-style:normal;font-size:11px;font-weight:700;background:linear-gradient(135deg,#F7CF6E,#D99A1E);color:#3A2600;border-radius:999px;padding:3px 9px}
.sheet-wrap{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .3s}
.sheet-wrap.on{background:rgba(0,0,0,.4)}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:26px 26px 0 0;padding:12px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);justify-self:center}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:12px 14px}
.payrow b{display:block}.payrow small{color:var(--muted);font-size:13px}.payrow strong{font:700 18px/1 var(--display)}
.okbtn{background:var(--good)!important;color:#fff!important;display:flex;gap:8px;align-items:center;justify-content:center}
.input.code{font:700 30px/1 var(--display);letter-spacing:.45em;text-align:center;min-height:64px}
.consent{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));max-width:500px;margin:0 auto;z-index:35;background:var(--card);border:1px solid var(--hair);border-radius:20px;padding:14px;display:grid;gap:10px;box-shadow:0 16px 40px rgba(0,0,0,.18);font-size:14px;color:var(--soft)}
.consent a{color:var(--a)}
.consent .btn{min-height:44px;font-size:15px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--on-ink);border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:opacity .4s;max-width:calc(100% - 32px)}
.toast.out{opacity:0}
#acbox{justify-content:center}
.spin.lite{border-color:rgba(255,255,255,.3);border-top-color:#fff}
.paybox{background:var(--card);border-radius:20px;padding:8px;min-height:200px}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--a);display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.upc{background:var(--card);border-radius:20px;padding:16px;display:grid;gap:10px;border:1.5px solid var(--line)}
.upc.on{border-color:var(--good)}
.legal a{color:var(--muted)}
.upc strong{color:var(--a)}
.btn svg{vertical-align:-3px}
/* text levels */
.lvls{display:grid;gap:8px}
.lvl{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid transparent;border-radius:18px;padding:12px 14px;background:var(--card2);cursor:pointer}
.lvl .ln{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font:700 17px/1 var(--display);background:var(--card);color:var(--a)}
.lvl.done .ln{background:var(--a);color:#fff}
.lvl.next{border-color:var(--a);background:var(--sel)}
.lvl.lock{opacity:.6}
.lvl.lock .ln{color:var(--muted)}
.lvl b{display:block;font-weight:600;font-size:15px}
.lvl small{display:block;color:var(--muted);font-size:12.5px}
.lvl .best{font:700 15px/1 var(--display);color:var(--soft);font-variant-numeric:tabular-nums}
.lvl .best.gold{color:var(--gold)}
.lvtag{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--a);background:var(--sel);border-radius:999px;padding:5px 10px;align-self:flex-start}
.src{font-size:12.5px;color:var(--muted);margin-top:-6px}
/* tour */
.tour{position:fixed;inset:0;z-index:40;pointer-events:none}
.tour-block,.tour-tip{pointer-events:auto}
.tour-block{position:absolute;inset:0}
.tour-hole{position:fixed;border-radius:18px;box-shadow:0 0 0 200vmax rgba(0,0,0,.55);outline:2px solid var(--a);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tour-tip{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:20px;padding:16px 18px;display:grid;gap:4px;box-shadow:0 20px 50px rgba(0,0,0,.3);transition:top .35s cubic-bezier(.2,.8,.2,1)}
.tour-tip .tn{font-size:12px;color:var(--muted);font-weight:700}
.tour-tip b{font:700 18px/1.2 var(--display);letter-spacing:-.02em}
.tour-tip .tt{font-size:15px;color:var(--soft);line-height:1.4}
.tour-b{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.tlink{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:8px 0}
.tlink:disabled{cursor:default;color:var(--a);font-weight:600}
.tbtn{border:0;border-radius:999px;background:var(--a);color:#fff;font-weight:600;font-size:15px;padding:10px 20px;cursor:pointer}
.pulse{animation:pulse 1.5s infinite;position:relative;z-index:41}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,91,216,.55)}70%{box-shadow:0 0 0 16px rgba(10,91,216,0)}100%{box-shadow:0 0 0 0 rgba(10,91,216,0)}}

/* ---------- missions: evaluated over the sessions since the current goal started ---------- */
var MISSIONS = [
  {mode:'read', test:function(h){ return true; }},
  {mode:'free', test:function(h){ return h.mode==='free' && (h.speech||0) >= 25; }},
  {mode:'free', test:function(h){ return h.mode==='free' && (h.speech||0) >= 20 && h.fpm <= 3; }},
  {mode:'read', test:function(h){ return h.band && h.wpm >= h.band[0] && h.wpm <= h.band[1] && h.score >= 75; }},
  {mode:'free', test:function(h, upto){ return streakAt(upto) >= 3; }},
  {mode:'free', goalTopic:true, test:function(h){ return h.mode==='free' && (h.speech||0) >= 40 && h.score >= 80 && h.fpm <= 2; }}
];
var FREE_MISSIONS = 2;
function streakAt(list){
  if(!list.length) return 0;
  var days = {}; list.forEach(function(h){ days[dayKey(h.ts)] = 1; });
  var d = new Date(list[list.length-1].ts), n = 0;
  while(days[dayKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function pathState(){
  var start = (profile && profile.pathStart) || 0;
  var hs = history.filter(function(h){ return h.ts >= start && h.lang === profile.train; });
  var done = [], from = 0;
  for(var m = 0; m < MISSIONS.length; m++){
    if(m >= FREE_MISSIONS && !isPremium()) break;
    var hit = -1;
    for(var k = from; k < hs.length; k++){ if(MISSIONS[m].test(hs[k], hs.slice(0, k+1))){ hit = k; break; } }
    if(hit < 0) break;
    done.push(hs[hit].ts); from = hit + 1;
  }
  return {n:done.length, total:MISSIONS.length, done:done, complete: done.length === MISSIONS.length};
}
function mTitle(i){ return XL('M')[i][0]; }
function mBadge(i){ return i === MISSIONS.length-1 ? XL('goalR')[profile.goal||0] : XL('M')[i][2]; }
function startMission(i){
  if(i >= FREE_MISSIONS && !isPremium()){ paywall('lock', home); return; }
  var M = MISSIONS[i], lang = profile.train, topic = null;
  if(M.mode === 'free') topic = pick(GOAL_TOPICS[lang][profile.goal||0]);
  session(M.mode, {mission:i, topic:topic});
}

function confetti(){
  if(REDUCE) return;
  var c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  var W = c.width = innerWidth*devicePixelRatio, H = c.height = innerHeight*devicePixelRatio, g = c.getContext('2d');
  var cols = ['#0A5BD8','#3D8BFF','#F2B53A','#D99A1E','#1E9E57','#7FB2FF'], P = [];
  for(var i = 0; i < 140; i++) P.push({x:W/2, y:H*0.35, vx:(Math.random()-.5)*W*0.03, vy:-Math.random()*H*0.025-H*0.005, s:(4+Math.random()*6)*devicePixelRatio, r:Math.random()*6, c:cols[i%cols.length]});
  var t = 0;
  (function f(){
    g.clearRect(0,0,W,H);
    P.forEach(function(p){ p.x += p.vx; p.y += p.vy; p.vy += H*0.0009; p.vx *= .99; p.r += .2; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); g.restore(); });
    if(++t < 150) requestAnimationFrame(f); else c.remove();
  })();
}

    em.oninput = function(){ document.getElementById('emerr').textContent = ''; };
    document.getElementById('bk').onclick = function(){ if(buy) paywall('back', onClose); else onClose(); };

      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){ document.getElementById('emerr').textContent = XL('acc_bad'); em.focus(); return; }
      if(!PAY.api){ account = {email:v}; store.set('account', account); track('account_done', {mode:'local'}); afterAuth(); return; }
      nb.disabled = true; nb.innerHTML = '<span class="spin"></span>';
      api('POST', '/api/auth/start', {email:v, lang:profile.ui}).then(function(r){ codeScreen(v, r.dev_code); })
        .catch(function(e){ nb.disabled = false; nb.textContent = XL('code_send'); document.getElementById('emerr').textContent = XL(e.message === 'wait' || e.message === 'too_many' ? 'err_wait' : e.message === 'bad_email' ? 'acc_bad' : 'err_net'); });
    };
    em.focus();
  }
  function codeScreen(email, devCode){
    app.innerHTML = '<div class="top"><button class="icon-btn" type="button" id="bk" aria-label="'+XL('back')+'">'+IC.back+'</button><span class="small">'+(buy?'2 / 3':'')+'</span><span style="width:40px"></span></div>'+
      '<h1 class="h1">'+XL('code_t')+'</h1><p class="p">'+esc(XL('code_p')(email))+'</p>'+
      '<input class="input code" id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="'+esc(XL('code_t'))+'">'+
      (devCode ? '<p class="small">dev: '+devCode+'</p>' : '')+
      '<p class="small" id="cderr" role="alert" style="color:var(--bad)"></p>'+
      '<button class="btn heat" type="button" id="ok">'+XL('code_ok')+'</button><button class="link" type="button" id="rs" disabled>'+XL('code_again')+' (30)</button>';
    var cd = document.getElementById('cd'), ok = document.getElementById('ok'), rs = document.getElementById('rs'), left = 30;
    var tm = setInterval(function(){ left--; if(left <= 0){ clearInterval(tm); rs.disabled = false; rs.textContent = XL('code_again'); } else rs.textContent = XL('code_again')+' ('+left+')'; }, 1000);
    document.getElementById('bk').onclick = function(){ clearInterval(tm); emailScreen(); };
    rs.onclick = function(){ clearInterval(tm); api('POST', '/api/auth/start', {email:email, lang:profile.ui}).then(function(r){ codeScreen(email, r.dev_code); }).catch(function(){ document.getElementById('cderr').textContent = XL('err_wait'); }); };
    cd.oninput = function(){ cd.value = cd.value.replace(/\D/g, '').slice(0,6); document.getElementById('cderr').textContent = ''; if(cd.value.length === 6) ok.click(); };
    ok.onclick = function(){
      if(cd.value.length !== 6){ cd.focus(); return; }
      ok.disabled = true; ok.innerHTML = '<span class="spin"></span>';
      api('POST', '/api/auth/verify', {email:email, code:cd.value, lang:profile.ui, anon_id:anonId}).then(function(r){
        clearInterval(tm); API.token = r.token; store.set('token', r.token); applyMe(r.me); track('account_done', {mode:'server'}); afterAuth();
      }).catch(function(e){ ok.disabled = false; ok.textContent = XL('code_ok'); document.getElementById('cderr').textContent = XL(e.message === 'wrong_code' ? 'err_code' : e.message === 'expired' ? 'err_expired' : e.message === 'too_many' ? 'err_wait' : 'err_net'); cd.select(); });
    };

  }
  function afterAuth(){
    if(!buy){ home(); window.scrollTo(0,0); return; }
    if(PAY.api && isPremium()){ toast(XL('already')); home(); return; }
    payScreen(buy, PAY.api ? '3 / 3' : '2 / 2', function(){ paidScreen(function(){ upsell(onClose); }); }, function(){ signIn(o, onClose); });
  }
  emailScreen();
}

/* inline checkout: Paddle draws the card form inside our page; card data never touches our code */
var PRICE_USD = {week:4.99, month:17.99, quarter:29.99, pack:9.99, pro:10};
function payScreen(key, stepLabel, onPaid, onBack){
  var loc = {ru:'ru', en:'en', kk:'ru'}[profile.ui];
  app.innerHTML = '<div class="top"><button class="icon-btn" type="button" id="bk" aria-label="'+XL('back')+'">'+IC.back+'</button><span class="small">'+stepLabel+'</span><span style="width:40px"></span></div>'+
    '<h1 class="h1">'+XL('pay_h')+'</h1>'+
    (PAY.env === 'sandbox' ? '<p class="warnbox">'+XL('pay_test')+'</p>' : '')+
    '<div class="paybox"><div class="checkout-frame"></div><p class="small center" id="pst"><span class="spin lite"></span></p></div>'+
    '<p class="small center">'+XL('pay_secure')+'</p>';
  track('checkout_open', {plan:key});
  document.getElementById('bk').onclick = function(){ paddleOn = null; try{ Paddle.Checkout.close(); }catch(e){} onBack(); };
  paddleOn = function(ev){
    if(ev.name === 'checkout.loaded'){ var ps = document.getElementById('pst'); if(ps) ps.textContent = ''; }
    if(ev.name === 'checkout.completed'){
      paddleOn = null; var d = ev.data || {};
      track('checkout_done', {plan:key, value:PRICE_USD[key]});
      // optimistic unlock; the server confirms once Paddle's webhook arrives
      if(key === 'pack' || key === 'pro'){ addons[key] = true; store.set('addons', addons); }
      else { plan = {id:key, ts:Date.now(), email:account && account.email, tx:d.transaction_id || '', env:PAY.env, pending:!!PAY.api}; store.set('plan', plan); }
      if(PAY.api){ setTimeout(syncMe, 4000); setTimeout(syncMe, 12000); }
      setTimeout(function(){ try{ Paddle.Checkout.close(); }catch(e){} onPaid(d.transaction_id || ''); }, 1200);
    }
  };
  loadPaddle().then(function(){
    var cd = {app:'speakline', plan:key}; if(account && account.uid) cd.uid = account.uid;
    Paddle.Checkout.open({
      items: [{priceId: PAY.prices[key], quantity: 1}],
      customer: account && account.email ? {email: account.email} : undefined,
      customData: cd,
      settings: {displayMode:'inline', frameTarget:'checkout-frame', frameInitialHeight:450,
        frameStyle:'width:100%;min-width:300px;background-color:transparent;border:none;', theme:'dark', locale:loc, allowLogout:false}
    });
  }).catch(function(){ var ps = document.getElementById('pst'); if(ps) ps.textContent = XL('pay_err'); });
  window.scrollTo(0,0);
}

/* ---------- coach marks: dim the screen, spotlight one element, explain it ---------- */
function tour(steps, onDone){
  steps = steps.filter(function(s){ return document.querySelector(s[0]); });
  if(!steps.length){ if(onDone) onDone(); return; }
  var i = 0, ov = document.createElement('div'); ov.className = 'tour';
  ov.innerHTML = '<div class="tour-block"></div><div class="tour-hole"></div><div class="tour-tip" role="dialog" aria-live="polite"><p class="tn"></p><b></b><p class="tt"></p><div class="tour-b"><button class="tlink" type="button" data-skip>'+XL('tour_skip')+'</button><button class="tbtn" type="button" data-next>'+XL('tour_next')+'</button></div></div>';
  document.body.appendChild(ov);
  var hole = ov.querySelector('.tour-hole'), tip = ov.querySelector('.tour-tip'), block = ov.querySelector('.tour-block'), target = null, tapFn = null;
  function show(){
    var s = steps[i]; target = document.querySelector(s[0]);
    tip.querySelector('.tn').textContent = (i+1)+' / '+steps.length;
    tip.querySelector('b').textContent = s[1]; tip.querySelector('.tt').textContent = s[2];
    var tap = !!s[3], nb = tip.querySelector('[data-next]');
    nb.hidden = tap; block.style.display = tap ? 'none' : 'block';
    tip.querySelector('[data-skip]').textContent = tap ? XL('tour_tap') : XL('tour_skip');
    tip.querySelector('[data-skip]').disabled = tap;
    if(tap){ target.classList.add('pulse'); tapFn = function(){ end(); }; target.addEventListener('click', tapFn, {once:true}); }
    var r = target.getBoundingClientRect();
    target.scrollIntoView({block: r.height > innerHeight*0.5 ? 'start' : 'center', behavior: REDUCE ? 'auto' : 'smooth'});
    setTimeout(place, REDUCE ? 30 : 420); setTimeout(place, 900);
  }
  function place(){
    if(!target) return;
    var r = target.getBoundingClientRect(), p = 8;
    var top = Math.max(8, r.top - p), bot = Math.min(innerHeight - 8, r.bottom + p);
    hole.style.top = top+'px'; hole.style.left = (r.left - p)+'px'; hole.style.width = (r.width + 2*p)+'px'; hole.style.height = Math.max(0, bot - top)+'px';
    var th = tip.offsetHeight, y;
    if(bot + 14 + th < innerHeight - 8) y = bot + 14; else if(top - 14 - th > 8) y = top - 14 - th; else y = innerHeight - th - 12;
    tip.style.top = y+'px';
  }
  function end(){
    window.removeEventListener('resize', place); window.removeEventListener('scroll', place, true);
    if(target) target.classList.remove('pulse');
    ov.remove(); if(onDone) onDone();
  }
  tip.querySelector('[data-next]').onclick = function(){ i++; if(i < steps.length) show(); else end(); };
  tip.querySelector('[data-skip]').onclick = end;
  window.addEventListener('resize', place); window.addEventListener('scroll', place, true);
  show();
}
window.__tourEnd = function(){ var t = document.querySelector('.tour'); if(t) t.remove(); };
