<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speakline Coach</title>
<meta name="theme-color" content="#0B0B0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one centred phone-width column, dark iOS-style app. Screens: onboarding → home (progress) → session (live mic) → result (score, transcript, advice). */
:root{
  --bg:#0B0B0F; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --muted:#8E8E93; --soft:#AEAEB2; --hair:rgba(255,255,255,.08);
  --a:#FF5A36; --b:#FF9F0A; --good:#30D158; --bad:#FF6961; --blue:#0A84FF;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Figtree","Helvetica Neue",Arial,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Figtree","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--text);letter-spacing:-.015em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid rgba(255,159,10,.6);outline-offset:2px;border-radius:12px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.logo{display:flex;gap:8px;align-items:center;font:700 18px/1 var(--display);letter-spacing:-.02em}
.logo i{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer}
.h1{font:700 32px/1.1 var(--display);letter-spacing:-.04em;text-wrap:balance}
.h2{font:700 22px/1.2 var(--display);letter-spacing:-.03em}
.p{color:var(--soft);font-size:15px}
.small{font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:16px;display:grid;gap:10px}
.label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.btn{min-height:54px;border:0;border-radius:16px;background:var(--ink);color:#0B0B0F;font:600 17px/1 var(--text);cursor:pointer;padding:0 18px;width:100%}
.btn.heat{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px;font-size:14px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;min-height:54px;padding:10px 16px;border-radius:16px;border:1.5px solid transparent;background:var(--card);cursor:pointer}
.opt b{display:block;font-weight:600}
.opt small{font-size:12px;color:var(--muted)}
.opt i{width:22px;height:22px;border-radius:50%;border:2px solid #48484A;flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--b);background:#221a10}
.opt[aria-pressed="true"] i{border-color:var(--b);background:var(--b)}
.opt[aria-pressed="true"] i::after{content:"";width:8px;height:8px;border-radius:50%;background:#0B0B0F}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:9px 14px;background:var(--card2);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:#0B0B0F;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px;display:grid;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font:700 24px/1.15 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:12px;color:var(--soft)}
.stat em.bad{color:var(--bad)}.stat em.good{color:var(--good)}.stat em.warn{color:var(--b)}
.streak{display:flex;align-items:center;gap:12px}
.xp{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.xp i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--a),var(--b))}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:0;border-radius:20px;background:var(--card);padding:14px 16px;cursor:pointer}
.mode .ic{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center}
.mode b{display:block;font-weight:600;font-size:16px}
.mode small{color:var(--muted);font-size:13px}
.chev{width:9px;height:9px;border-top:2px solid #636366;border-right:2px solid #636366;transform:rotate(45deg)}
.prompt{font:600 22px/1.35 var(--display);letter-spacing:-.025em}
.wave{width:100%;height:110px;display:block}
.recwrap{display:grid;justify-items:center;gap:10px}
.rec{width:84px;height:84px;border-radius:50%;border:4px solid #fff;background:transparent;position:relative;cursor:pointer}
.rec::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#FF3B30;transition:all .25s}
.rec.on::after{inset:22px;border-radius:7px}
.timer{font:600 20px/1 var(--display);font-variant-numeric:tabular-nums}
.live{min-height:72px;font-size:16px;line-height:1.55;color:var(--ink)}
.live .interim{color:var(--muted)}
.srst{min-height:0;color:#FF9F0A;text-align:center}
.srst.on{min-height:18px}
.tx mark.hes{background:rgba(255,69,58,.12);border:1px dashed rgba(255,69,58,.6);font-style:italic}
.dbg{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre-wrap}
.tx{font-size:16px;line-height:1.65;background:var(--card);border-radius:18px;padding:14px 16px}
.tx mark{background:rgba(255,69,58,.22);color:var(--bad);border-radius:5px;padding:0 4px;font-weight:600}
.tx .miss{color:var(--b);text-decoration:underline wavy;text-underline-offset:3px}
.tx .ok{color:var(--ink)}
.ringbox{display:grid;place-items:center;position:relative;width:180px;height:180px;margin:0 auto}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .num{font:700 50px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ringbox .num small{font-size:24px}
.center{text-align:center}
.tip{display:grid;grid-template-columns:36px 1fr;gap:12px;background:var(--card);border-radius:18px;padding:14px}
.tip .n{width:36px;height:36px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--b)}
.tip b{display:block;margin-bottom:2px}
.tip p{color:var(--soft);font-size:14px}
.tip .drill{margin-top:6px;font-size:13px;color:var(--ink);background:var(--card2);border-radius:10px;padding:8px 10px}
.badge{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,rgba(255,90,54,.18),rgba(255,159,10,.18));border:1px solid rgba(255,159,10,.4);border-radius:14px;padding:10px 12px;font-size:14px}
.chart svg{display:block;width:100%;height:auto}
.hist{display:grid;gap:6px}
.hrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:10px 12px;background:var(--card);border-radius:14px}
.hrow span{color:var(--muted)}
.warnbox{background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.35);color:#FFD9A0;border-radius:14px;padding:12px 14px;font-size:14px}
.input{width:100%;min-height:48px;border-radius:14px;border:0;background:var(--card2);padding:0 14px;font-size:15px}
.ai{white-space:pre-wrap;font-size:15px;line-height:1.55;color:var(--ink)}
.row{display:flex;gap:10px}
.row > *{flex:1}

/* splash */
.splash{position:fixed;inset:0;z-index:20;background:radial-gradient(70% 50% at 50% 42%,rgba(255,90,54,.22),transparent 70%),#0B0B0F;display:grid;place-items:center;cursor:pointer;transition:opacity .5s ease}
.splash.out{opacity:0}
.sp-in{display:grid;justify-items:center;gap:22px;text-align:center;padding:0 24px}
.sp-mark{width:112px;height:112px;border-radius:32px;background:linear-gradient(135deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 20px 60px rgba(255,90,54,.35);animation:pop .9s cubic-bezier(.2,1.4,.3,1) both}
.sp-mark i{display:block;width:7px;border-radius:4px;background:#fff;animation:eq 1s ease-in-out infinite}
.sp-mark i:nth-child(1){height:22px;animation-delay:-.2s}.sp-mark i:nth-child(2){height:44px;animation-delay:-.5s}.sp-mark i:nth-child(3){height:64px;animation-delay:-.1s}.sp-mark i:nth-child(4){height:40px;animation-delay:-.7s}.sp-mark i:nth-child(5){height:24px;animation-delay:-.35s}
.sp-word{font:800 40px/1 var(--display);letter-spacing:-.045em;animation:rise .8s .35s both}
.sp-tag{font:500 19px/1.35 var(--display);color:var(--soft);letter-spacing:-.02em;animation:rise .8s .6s both;max-width:22ch}
.sp-bar{width:120px;height:3px;border-radius:2px;background:var(--card2);overflow:hidden;animation:rise .6s .8s both}
.sp-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--a),var(--b));transform-origin:left;animation:load 2.2s .8s linear both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* intro carousel */
.intro{flex:1;display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 60px)}
.intro-view{overflow:hidden;flex:1;touch-action:pan-y}
.intro-track{display:flex;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.slide{flex:0 0 100%;display:flex;flex-direction:column;gap:16px;padding-top:8px}
.ill{background:var(--card);border-radius:28px;min-height:260px;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.ill::before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,159,10,.22),transparent 65%)}
.bubble{position:relative;max-width:88%;background:var(--card2);border-radius:20px 20px 20px 6px;padding:14px 16px;font-size:17px;line-height:1.55}
.bubble mark{background:rgba(255,69,58,.22);color:var(--bad);border-radius:5px;padding:0 4px;font-weight:600}
.bubble.r{border-radius:20px 20px 6px 20px;background:#2a2016;margin-left:auto;font-size:15px;color:#FFD9A0}
.steps{display:grid;gap:10px;width:100%;position:relative}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:var(--card2);border-radius:16px;padding:12px}
.step b{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#fff;font:700 17px/1 var(--display)}
.step span{font-size:15px;line-height:1.4}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--card2);transition:all .3s}
.dots i.on{width:22px;background:var(--b)}
.mini-ring{position:relative;width:150px;height:150px;display:grid;place-items:center}
.mini-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.mini-ring b{font:700 42px/1 var(--display);letter-spacing:-.04em}
.mini-ring small{font-size:20px}
@media (prefers-reduced-motion:reduce){.sp-mark,.sp-mark i,.sp-word,.sp-tag,.sp-bar,.sp-bar i{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* journey: hero, missions, path, paywall, tours */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;display:grid;gap:14px;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,214,10,.35),transparent 55%),linear-gradient(140deg,#FF5A36 0%,#FF7A1A 55%,#FF9F0A 100%);box-shadow:0 18px 50px rgba(255,90,54,.28)}
.hero-l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero-t{font:800 28px/1.08 var(--display);letter-spacing:-.04em;text-wrap:balance;margin-top:-6px}
.hero-row{display:flex;gap:16px;align-items:center}
.hero-k{font-weight:700;font-size:15px}
.hero-v{font:800 20px/1.15 var(--display);letter-spacing:-.03em}
.hero-r{display:flex;gap:6px;align-items:center;font-size:13px;opacity:.95;margin-top:8px}
.hero-bar{height:8px;border-radius:4px;background:rgba(0,0,0,.18);overflow:hidden;margin-top:8px}
.hero-bar i{display:block;height:100%;background:#fff;border-radius:4px}
.hero-chips{display:flex;flex-wrap:wrap;gap:6px}
.hero-chips span{display:inline-flex;gap:5px;align-items:center;background:rgba(0,0,0,.18);border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:600}
.pring{position:relative;flex:none;display:grid;place-items:center}
.pring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.pring b{font:800 26px/1 var(--display);letter-spacing:-.04em;display:grid;place-items:center}
.pring b small{font-size:14px}
.btn.white{background:#fff;color:#0B0B0F}
.mcard{background:var(--card);border-radius:22px;padding:18px;display:grid;gap:10px;border:1px solid rgba(255,159,10,.35)}
.mcard.locked{border-color:var(--hair)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mreward{display:flex;gap:8px;align-items:center;font-size:14px;color:#FFD9A0;background:rgba(255,159,10,.1);border-radius:12px;padding:8px 10px}
.lockpill{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600;color:var(--soft);background:var(--card2);border-radius:999px;padding:4px 9px}
.planpill{border:0;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;display:inline-flex;gap:5px;align-items:center}
.planpill.on{background:var(--card);color:#FFD60A}
.path{list-style:none;margin:0;padding:0;display:grid;gap:0}
.pn{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:14px}
.pn:last-child{padding-bottom:0}
.pn::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--card2)}
.pn:last-child::before{display:none}
.pn.done::before{background:var(--b)}
.pn .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-weight:700;font-size:14px;color:var(--soft)}
.pn.done .dot{background:linear-gradient(135deg,var(--a),var(--b))}
.pn.cur .dot{background:#fff;color:#0B0B0F;box-shadow:0 0 0 5px rgba(255,159,10,.3)}
.pn.fin .dot{background:#2a2410}
.pn b{display:block;font-size:15px;font-weight:600;padding-top:6px}
.pn small{color:var(--muted);font-size:12.5px}
.pn.todo b{color:var(--soft)}
.today{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:18px;padding:12px 14px;background:#0A84FF;color:#fff;cursor:pointer}
.today svg{background:rgba(255,255,255,.2);border-radius:11px;padding:9px;width:40px;height:40px}
.today b{display:block}.today small{opacity:.85;font-size:13px}
.today .chev{border-color:#fff}
.mlist{display:grid;gap:8px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:10px 12px}
.mrow b{display:block;font-size:15px}.mrow small{color:var(--muted);font-size:12.5px}
.mrow .chip{background:var(--ink);color:#0B0B0F;font-weight:600}
#mform{display:grid;gap:8px}
.chip.dim{opacity:.55}
.hrow2{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:16px;padding:10px 12px;background:var(--card2);cursor:pointer}
.card .hrow2{background:var(--card2)}
.hist > .hrow2{background:var(--card)}
.card .hist > .hrow2{background:var(--card2)}
.hmid b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmid{min-width:0}.hmid small{color:var(--muted);font-size:12.5px}
.sc{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font:800 17px/1 var(--display);font-variant-numeric:tabular-nums}
.sc.good{background:rgba(48,209,88,.16);color:var(--good)}.sc.warn{background:rgba(255,159,10,.16);color:var(--b)}.sc.bad{background:rgba(255,105,97,.16);color:var(--bad)}
.sc.big{width:76px;height:76px;border-radius:22px;font-size:24px}
.dhead{display:flex;gap:14px;align-items:center}
.dhead b{font-size:17px}
.tipsbox{display:grid;gap:10px}
.sticky{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0 calc(4px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.sticky > *{flex:1}
.sticky .btn.heat{flex:1.6}
/* reward */
.celebrate{flex:1;display:grid;align-content:center;justify-items:center;gap:16px;text-align:center;min-height:calc(100vh - 60px)}
.medal{animation:pop .8s cubic-bezier(.2,1.4,.3,1) both;filter:drop-shadow(0 16px 40px rgba(255,159,10,.45))}
.medal svg{width:120px;height:120px}
.cert{width:100%;border-radius:20px;padding:18px;background:linear-gradient(140deg,#2a2410,#1C1C1E);border:1px solid rgba(255,214,10,.45);display:grid;gap:6px}
.cert-t{font:700 19px/1.3 var(--display);letter-spacing:-.02em;color:#FFE58A}
.cprog{width:100%;display:grid;gap:8px}
.cprog .hero-bar{background:var(--card2)}
.cprog .hero-bar i{background:linear-gradient(90deg,var(--a),var(--b))}
.celebrate .btn{max-width:420px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
/* paywall */
.pw-hero{display:grid;gap:10px}
.pw-bars{display:flex;gap:14px;align-items:flex-end;padding:0 4px}
.pw-bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;position:relative}
.pw-bars i{display:block;width:100%;border-radius:12px 12px 6px 6px;background:var(--card2)}
.pw-bars i.t{background:linear-gradient(180deg,var(--b),var(--a))}
.pw-bars span{font:800 18px/1 var(--display)}
.pw-bars small{font-size:12px;color:var(--muted)}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feat li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center}
.feat .fi{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center}
.feat b{display:block;font-size:15px}.feat small{color:var(--muted);font-size:13px}
.plans{display:grid;gap:8px}
.plan{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;min-height:64px;padding:12px 16px;border-radius:16px;border:2px solid transparent;background:var(--card);cursor:pointer}
.plan[aria-checked="true"]{border-color:var(--b);background:#221a10}
.plan b{display:block;font-size:16px}.plan small{color:var(--muted);font-size:13px}
.plan strong{font:700 18px/1 var(--display)}
.plan em{position:absolute;top:-9px;right:14px;font-style:normal;font-size:11px;font-weight:800;background:var(--good);color:#04210d;border-radius:999px;padding:3px 8px}
.sheet-wrap{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .3s}
.sheet-wrap.on{background:rgba(0,0,0,.6)}
.sheet{width:100%;max-width:520px;background:#1C1C1E;border-radius:24px 24px 0 0;padding:12px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#48484A;justify-self:center}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:12px 14px}
.payrow b{display:block}.payrow small{color:var(--muted);font-size:13px}.payrow strong{font:700 18px/1 var(--display)}
.okbtn{background:var(--good)!important;color:#04210d!important;display:flex;gap:8px;align-items:center;justify-content:center}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid rgba(0,0,0,.2);border-top-color:#0B0B0F;display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.upc{background:var(--card);border-radius:20px;padding:16px;display:grid;gap:10px;border:1.5px solid var(--hair)}
.upc.on{border-color:var(--good)}
.legal a{color:var(--soft)}
.upc strong{color:var(--b)}
.btn svg{vertical-align:-3px}
/* tour */
.tour{position:fixed;inset:0;z-index:40;pointer-events:none}
.tour-block,.tour-tip{pointer-events:auto}
.tour-block{position:absolute;inset:0}
.tour-hole{position:fixed;border-radius:18px;box-shadow:0 0 0 200vmax rgba(0,0,0,.74);outline:2px solid var(--b);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tour-tip{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:#F5F5F7;color:#0B0B0F;border-radius:18px;padding:14px 16px;display:grid;gap:4px;box-shadow:0 20px 50px rgba(0,0,0,.5);transition:top .35s cubic-bezier(.2,.8,.2,1)}
.tour-tip .tn{font-size:12px;color:#6e6e73;font-weight:700}
.tour-tip b{font:700 18px/1.2 var(--display);letter-spacing:-.02em}
.tour-tip .tt{font-size:15px;color:#3a3a3c;line-height:1.4}
.tour-b{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.tlink{background:none;border:0;color:#6e6e73;font-size:14px;cursor:pointer;padding:8px 0}
.tlink:disabled{cursor:default;color:#FF5A36;font-weight:600}
.tbtn{border:0;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:700;font-size:15px;padding:10px 18px;cursor:pointer}
.pulse{animation:pulse 1.5s infinite;position:relative;z-index:41}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,159,10,.7)}70%{box-shadow:0 0 0 16px rgba(255,159,10,0)}100%{box-shadow:0 0 0 0 rgba(255,159,10,0)}}
@media (prefers-reduced-motion:reduce){.pulse,.medal,.spin{animation:none}}
</style>

function plural(n, a, b, c){ var m10 = n%10, m100 = n%100; return (m10===1 && m100!==11) ? a : (m10>=2 && m10<=4 && (m100<10||m100>=20)) ? b : c; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function L(k){ return T[(profile && profile.ui) || 'ru'][k]; }
function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
function fmt1(x){ return (Math.round(x*10)/10).toString().replace('.', ','); }
function norm(w){ return w.toLowerCase().replace(/ё/g,'е').replace(/[^\p{L}\p{N}'’-]/gu,'').replace(/’/g,"'"); }
function words(text){ return text.split(/\s+/).map(norm).filter(Boolean); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ================= gamification ================= */
function totalXP(){ return history.reduce(function(s,h){ return s + (h.xp||0); }, 0); }
var LV = [0, 200, 500, 900, 1400];
function levelOf(xp){ var i = 0; while(i < LV.length-1 && xp >= LV[i+1]) i++; var next = LV[i+1] || LV[i]; return {i:i, cur:xp-LV[i], need: next-LV[i] || 1, max: i===LV.length-1}; }
function dayKey(ts){ var d = new Date(ts); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function streak(){
  if(!history.length) return 0;
  var days = {}; history.forEach(function(h){ days[dayKey(h.ts)] = 1; });
  var n = 0, d = new Date();
  if(!days[dayKey(d)]) d.setDate(d.getDate()-1);
  while(days[dayKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* only one SpeechRecognition may run at a time in Chrome — always release the previous one first */
var liveRecog = null;
function releaseRecog(){
  return new Promise(function(res){
    var r = liveRecog; liveRecog = null;
    if(!r) return res();
    var done = false, fin = function(){ if(!done){ done = true; setTimeout(res, 150); } };
    r.onresult = null; r.onerror = null; r.onend = fin;
    try{ r.abort(); }catch(e){ fin(); }
    setTimeout(fin, 900);
  });
}
function releaseMic(){ if(media){ try{ media.getTracks().forEach(function(tr){ tr.stop(); }); }catch(e){} media = null; } }

function start(mode, text, maxSec){

    releaseMic();
    return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:false}});
  }).then(function(stream){
    media = stream;

/* ---------- missions: evaluated over the sessions since the current goal started ---------- */
var MISSIONS = [
  {mode:'read', test:function(h){ return true; }},
  {mode:'free', test:function(h){ return h.mode==='free' && (h.speech||0) >= 25; }},
  {mode:'free', test:function(h){ return h.mode==='free' && (h.speech||0) >= 20 && h.fpm <= 3; }},
  {mode:'read', test:function(h){ return h.band && h.wpm >= h.band[0] && h.wpm <= h.band[1] && h.score >= 75; }},
  {mode:'free', test:function(h, upto){ return streakAt(upto) >= 3; }},
  {mode:'free', goalTopic:true, test:function(h){ return h.mode==='free' && (h.speech||0) >= 40 && h.score >= 80 && h.fpm <= 2; }}
];
var FREE_MISSIONS = 2;
function streakAt(list){
  if(!list.length) return 0;
  var days = {}; list.forEach(function(h){ days[dayKey(h.ts)] = 1; });
  var d = new Date(list[list.length-1].ts), n = 0;
  while(days[dayKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function pathState(){
  var start = (profile && profile.pathStart) || 0;
  var hs = history.filter(function(h){ return h.ts >= start && h.lang === profile.train; });
  var done = [], from = 0;
  for(var m = 0; m < MISSIONS.length; m++){
    if(m >= FREE_MISSIONS && !isPremium()) break;
    var hit = -1;
    for(var k = from; k < hs.length; k++){ if(MISSIONS[m].test(hs[k], hs.slice(0, k+1))){ hit = k; break; } }
    if(hit < 0) break;
    done.push(hs[hit].ts); from = hit + 1;
  }
  return {n:done.length, total:MISSIONS.length, done:done, complete: done.length === MISSIONS.length};
}
function mTitle(i){ return XL('M')[i][0]; }
function mBadge(i){ return i === MISSIONS.length-1 ? XL('goalR')[profile.goal||0] : XL('M')[i][2]; }
function startMission(i){
  if(i >= FREE_MISSIONS && !isPremium()){ paywall('lock', home); return; }
  var M = MISSIONS[i], lang = profile.train, topic = null;
  if(M.mode === 'free') topic = pick(GOAL_TOPICS[lang][profile.goal||0]);
  session(M.mode, {mission:i, topic:topic});
}

/* stats + tips + transcript, shared by the result screen and history */
function reportBody(d){
  var band = d.band || PACE[d.lang], ui = profile.ui;
  var paceTag = d.wpm > band[1] ? ['bad', L('fast')] : d.wpm < band[0] ? ['warn', L('slow')] : ['good', L('ok')];
  var tx = (d.toks||[]).map(function(t){ return t[1]===2 ? '<mark class="hes">'+esc(t[0])+'</mark>' : t[1] ? '<mark>'+esc(t[0])+'</mark>' : esc(t[0]); }).join(' ');
  var refHtml = d.ref && d.refMarks ? d.ref.split(/\s+/).filter(function(t){ return norm(t); }).map(function(t,i){ return '<span class="'+(d.refMarks[i]?'ok':'miss')+'">'+esc(t)+'</span>'; }).join(' ') : '';
  var tips = (d.issues||[]).map(function(k, i){ var a = ADVICE[k][ui]; return '<div class="tip"><span class="n">'+(i+1)+'</span><div><b>'+a[0]+'</b><p>'+a[1]+'</p><p class="drill">'+a[2].replace('{lo}', band[0]).replace('{hi}', band[1])+'</p></div></div>'; }).join('');
  return '<div class="grid2" id="statgrid">'+
      stat(L('pace'), Math.round(d.wpm)+' '+L('wpm'), L('target')+' '+band[0]+'–'+band[1]+' · '+paceTag[1], paceTag[0])+
      stat(L('fillers'), fmt1(d.fpm)+' '+L('per_min'), d.nF ? d.nF+': '+d.fill : L('none'), d.fpm > 3 ? 'bad' : d.fpm > 1 ? 'warn' : 'good')+
      stat(L('pauses'), String(d.pauses), d.longP ? L('long_p')(d.longP) : L('avg')+' '+fmt1(d.avgP||0)+' '+(ui==='en'?'s':'с'), d.longP ? 'warn' : 'good')+
      (d.sd==null ? stat(L('inton'), '—', '', '') : stat(L('inton'), fmt1(d.sd)+' '+L('st'), d.sd < 1.5 ? L('mono') : L('lively'), d.sd < 1.5 ? 'warn' : 'good'))+
      (d.acc!=null ? stat(L('acc'), Math.round(d.acc*100)+'%', '', d.acc < .85 ? 'warn' : 'good') : '')+
      (d.conf!=null ? stat(L('clar'), Math.round(d.conf*100)+'%', '', d.conf < .75 ? 'warn' : 'good') : '')+
    '</div>'+
    '<p class="label">'+L('tips')+'</p><div id="tips" class="tipsbox">'+tips+'</div>'+
    '<p class="label">'+L('transcript')+'</p><div id="txbox"><p class="tx">'+(tx || '—')+'</p>'+((d.toks||[]).some(function(t){ return t[1]===2; }) ? '<p class="small" style="margin-top:6px">'+esc(HESTIP[ui])+'</p>' : '')+'</div>'+
    (refHtml ? '<p class="tx">'+refHtml+'</p><p class="small">'+L('ref_hint')+'</p>' : '');
}

function result(r){

    document.getElementById('bk').onclick = home; document.getElementById('ag').onclick = function(){ session(r.mode, ctx0); }; return;
  }
  var before = pathState();
  var mine = history.filter(function(h){ return h.lang===r.lang; }), prev = mine[mine.length-1];
  var xp = Math.round(r.score/2) + 10 + (prev && r.score > prev.score ? 10 : 0);
  var lvBefore = levelOf(totalXP()).i;
  var rec = {ts:Date.now(), mode:r.mode, lang:r.lang, score:r.score, wpm:Math.round(r.wpm), fpm:+r.fpm.toFixed(2), xp:xp, speech:Math.round(r.speech),
    nF:r.nF, fill:r.nF ? uniqFillers(r) : '', pauses:r.pauses, longP:r.longP, avgP:+r.avgP.toFixed(2), sd:r.sd==null?null:+r.sd.toFixed(2), acc:r.acc, conf:r.conf, band:r.band,
    issues:r.issues.map(function(x){ return x.k; }), toks:r.toks.map(function(t){ return [t.w, t.f==='hes'?2:t.f?1:0]; }), prompt:r.prompt, ref:r.ref, refMarks:r.refMarks,
    mission: ctx0.mission!=null ? ctx0.mission : null};
  history.push(rec);
  history.forEach(function(h, i){ if(i < history.length-60){ delete h.toks; delete h.refMarks; } });   // keep storage small
  store.set('history', history);
  var after = pathState(), lvAfter = levelOf(totalXP()).i;
  if(rec.mission!=null && after.n <= rec.mission){ rec.mission = null; store.set('history', history); }   // attempt didn't meet the bar → plain practice
  var newly = []; for(var m = before.n; m < after.n; m++) newly.push(m);
  var badge = lvAfter > lvBefore ? L('level')+' '+(lvAfter+1)+' · '+L('lv')[lvAfter] : (r.nF===0 ? (profile.ui==='ru'?'Ни одного паразита':profile.ui==='kk'?'Бірде-бір арам сөз жоқ':'Zero filler words') : null);
  var dbg = /[?&]debug=1/.test(location.search) ? '<div class="card dbg">'+esc('hesitations: '+r.hes.map(function(h){ return h.s.toFixed(2)+'–'+h.e.toFixed(2)+'s'; }).join(', ')+'\nlexical fillers: '+r.nLex+'\nrecogniser restarts: '+r.restarts+'\nlast error: '+(r.srErr||'—'))+'</div>' : '';
  var missNote = ctx0.mission!=null && !newly.length ? '<p class="warnbox">'+XL('mission')+' '+(ctx0.mission+1)+' · '+esc(mTitle(ctx0.mission))+': '+esc(XL('M')[ctx0.mission][1])+'</p>' : '';

  app.innerHTML =
    '<div class="top"><button class="icon-btn" type="button" id="bk" aria-label="'+L('home')+'">'+IC.back+'</button><span class="small">'+LANG_NAMES[r.lang].n+' · '+(r.mode==='read'?L('m_read'):L('m_free'))+'</span><span style="width:40px"></span></div>'+
    '<div class="ringbox" id="ringbox"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A36"/><stop offset="1" stop-color="#FF9F0A"/></linearGradient></defs><circle cx="60" cy="60" r="52" fill="none" stroke="#2C2C2E" stroke-width="10"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg><span class="num"><span id="num">0</span><small>%</small></span></div>'+
    '<div class="center"><p class="h2">'+L('sound')(r.score)+'</p><p class="small" style="margin-top:4px;color:'+(prev && r.score>=prev.score?'#30D158':'#8E8E93')+'">'+(prev ? L('vs')(r.score-prev.score) : L('first'))+' · '+L('got_xp')(xp)+'</p></div>'+
    (badge ? '<div class="badge">'+ICX.medal.replace('width="72" height="72"','width="24" height="24"')+'<span><b>'+L('badge')+':</b> '+esc(badge)+'</span></div>' : '')+
    missNote+reportBody(rec)+dbg+
    ((aiKey || addons.pro) ? '<button class="btn ghost" type="button" id="ai">'+L('ai_btn')+'</button><div class="card" id="aibox" hidden><p class="ai" id="aitx"></p></div>' : '')+
    '<div class="sticky"><button class="btn ghost" type="button" id="ag">'+XL('again')+'</button><button class="btn heat" type="button" id="cont">'+XL('cont')+'</button></div>';
  var arc = document.getElementById('arc'), num = document.getElementById('num'), C = 326.7, to = r.score;
  var setv = function(v){ num.textContent = Math.round(v); arc.setAttribute('stroke-dashoffset', (C*(1-v/100)).toFixed(1)); };
  if(REDUCE) setv(to); else { var t0 = null; var tick = function(ts){ if(!t0) t0 = ts; var k = Math.min(1,(ts-t0)/1200); setv(to*(1-Math.pow(1-k,3))); if(k < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
  var next = function(){ afterResult(rec, newly, after); };
  document.getElementById('bk').onclick = next; document.getElementById('cont').onclick = next;
  document.getElementById('ag').onclick = function(){ session(r.mode, ctx0); };
  var aiBtn = document.getElementById('ai'); if(aiBtn) aiBtn.onclick = function(){ if(!aiKey){ aiBtn.textContent = L('key_l'); settings(); return; } aiReview(r, aiBtn); };
  window.scrollTo(0,0);
  if(!tours.res){ tours.res = 1; store.set('tours', tours); setTimeout(function(){ tour(XL('T_res')); }, 1400); }
}
/* after a recording: rewards first, then the offer (once), then home */
function afterResult(rec, newly, after){
  var queue = newly.slice();
  function step(){
    if(queue.length){ var m = queue.shift(); celebrate(m, after, step); return; }
    if(!isPremium() && !store.get('pwSeen', false)){ store.set('pwSeen', true); paywall('first', home, rec.score); return; }
    home(); window.scrollTo(0,0);
  }
  step();
}

function confetti(){
  if(REDUCE) return;
  var c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  var W = c.width = innerWidth*devicePixelRatio, H = c.height = innerHeight*devicePixelRatio, g = c.getContext('2d');
  var cols = ['#FF5A36','#FF9F0A','#FFD60A','#30D158','#0A84FF','#fff'], P = [];
  for(var i = 0; i < 140; i++) P.push({x:W/2, y:H*0.35, vx:(Math.random()-.5)*W*0.03, vy:-Math.random()*H*0.025-H*0.005, s:(4+Math.random()*6)*devicePixelRatio, r:Math.random()*6, c:cols[i%cols.length]});
  var t = 0;
  (function f(){
    g.clearRect(0,0,W,H);
    P.forEach(function(p){ p.x += p.vx; p.y += p.vy; p.vy += H*0.0009; p.vx *= .99; p.r += .2; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); g.restore(); });
    if(++t < 150) requestAnimationFrame(f); else c.remove();
  })();
}

/* ---------- coach marks: dim the screen, spotlight one element, explain it ---------- */
function tour(steps, onDone){
  steps = steps.filter(function(s){ return document.querySelector(s[0]); });
  if(!steps.length){ if(onDone) onDone(); return; }
  var i = 0, ov = document.createElement('div'); ov.className = 'tour';
  ov.innerHTML = '<div class="tour-block"></div><div class="tour-hole"></div><div class="tour-tip" role="dialog" aria-live="polite"><p class="tn"></p><b></b><p class="tt"></p><div class="tour-b"><button class="tlink" type="button" data-skip>'+XL('tour_skip')+'</button><button class="tbtn" type="button" data-next>'+XL('tour_next')+'</button></div></div>';
  document.body.appendChild(ov);
  var hole = ov.querySelector('.tour-hole'), tip = ov.querySelector('.tour-tip'), block = ov.querySelector('.tour-block'), target = null, tapFn = null;
  function show(){
    var s = steps[i]; target = document.querySelector(s[0]);
    tip.querySelector('.tn').textContent = (i+1)+' / '+steps.length;
    tip.querySelector('b').textContent = s[1]; tip.querySelector('.tt').textContent = s[2];
    var tap = !!s[3], nb = tip.querySelector('[data-next]');
    nb.hidden = tap; block.style.display = tap ? 'none' : 'block';
    tip.querySelector('[data-skip]').textContent = tap ? XL('tour_tap') : XL('tour_skip');
    tip.querySelector('[data-skip]').disabled = tap;
    if(tap){ target.classList.add('pulse'); tapFn = function(){ end(); }; target.addEventListener('click', tapFn, {once:true}); }
    var r = target.getBoundingClientRect();
    target.scrollIntoView({block: r.height > innerHeight*0.5 ? 'start' : 'center', behavior: REDUCE ? 'auto' : 'smooth'});
    setTimeout(place, REDUCE ? 30 : 420); setTimeout(place, 900);
  }
  function place(){
    if(!target) return;
    var r = target.getBoundingClientRect(), p = 8;
    var top = Math.max(8, r.top - p), bot = Math.min(innerHeight - 8, r.bottom + p);
    hole.style.top = top+'px'; hole.style.left = (r.left - p)+'px'; hole.style.width = (r.width + 2*p)+'px'; hole.style.height = Math.max(0, bot - top)+'px';
    var th = tip.offsetHeight, y;
    if(bot + 14 + th < innerHeight - 8) y = bot + 14; else if(top - 14 - th > 8) y = top - 14 - th; else y = innerHeight - th - 12;
    tip.style.top = y+'px';
  }
  function end(){
    window.removeEventListener('resize', place); window.removeEventListener('scroll', place, true);
    if(target) target.classList.remove('pulse');
    ov.remove(); if(onDone) onDone();
  }
  tip.querySelector('[data-next]').onclick = function(){ i++; if(i < steps.length) show(); else end(); };
  tip.querySelector('[data-skip]').onclick = end;
  window.addEventListener('resize', place); window.addEventListener('scroll', place, true);
  show();
}
window.__tourEnd = function(){ var t = document.querySelector('.tour'); if(t) t.remove(); };

/* ================= boot ================= */
document.documentElement.lang = (profile && profile.ui) || 'ru';
splash(function(){ if(profile) home(); else intro(); });
})();
</script>
</body>
</html>
