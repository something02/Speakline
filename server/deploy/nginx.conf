# /etc/nginx/sites-available/speakline — replace speakline.kz with your domain
server {
  listen 80;
  server_name speakline.kz www.speakline.kz;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://speakline.kz$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name speakline.kz;
  ssl_certificate     /etc/letsencrypt/live/speakline.kz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/speakline.kz/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  # microphone is needed for recording; everything else off
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
  client_max_body_size 1m;
  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
}
